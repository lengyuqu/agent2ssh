        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, path]
              properties:
                host: { type: string }
                path: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
