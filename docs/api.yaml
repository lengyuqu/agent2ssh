          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The audit log could not be read while computing the trend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /exec/preview:
    post:
      summary: Preview effective risk and approval requirements without executing
      description: Returns the execution plan (per-target effective risk, overall risk, approval requirement, warnings) for a single host or a multi-host/tag selection. Applies bearer-token host/tag/command scope before generating the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                host:         { type: string, nullable: true }
                hosts:
                  type: array
                  items: { type: string }
                  nullable: true
                command:      { type: string }
                timeout_secs: { type: integer, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        host:         { type: string }
                        host_address: { type: string }
                        command:      { type: string }
                        risk_level:   { $ref: "#/components/schemas/RiskLevel" }
                        needs_force:  { type: boolean, description: "True when the effective risk is high or blocked — the same condition that makes `/exec` demand `force: true`" }
                        blocked:      { type: boolean, description: "True when the effective risk is `blocked`: the command cannot be executed at all" }
                        jump_host:    { type: string, nullable: true }
                        timeout_secs: { type: integer }
                  overall_risk:
                    allOf: [{ $ref: "#/components/schemas/RiskLevel" }]
                    description: "The highest severity across the per-target `risk_level` values, with `blocked` ranking above `high` (`core.rs: max_severity`). `requires_approval` below is derived from this field, not from the individual targets, so a selection that mixes `blocked` and `high` reports `overall_risk: blocked` and `requires_approval: false` together — `blocked` is refused outright, so no approval is offered for it. Treat a `blocked` in any target as the operative answer."
                  requires_approval: { type: boolean, description: "True only when the overall risk is `high` — this preview reports the force/approval rule and does not consult `approval_policies`, so a medium-risk command that a policy gates still answers false here while `/exec` creates an approval. Use `/approval/check` for the policy answer and this field for the risk answer." }
                  warnings:
                    type: array
                    items: { type: string }
        "400":
          description: Missing host/hosts, unknown target, or an empty multi-host/tag selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scoped token does not allow one of the requested targets or the command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /approval/check:
    post:
      summary: Check whether a command on a host would require approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, command]
              properties:
                host:    { type: string }
                command: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  requires_approval: { type: boolean, description: "True when a policy in `approval_policies` matches this host/command/risk. False means no policy asks for an approval — it does **not** mean `/exec` will run unapproved: this check takes no `force` input, and `/exec` demands an approval or `force: true` for a high-risk command regardless of policies. Read it together with `risk_level`. Because `check_approval_required` stops at the first matching policy, a `false` can also come from an earlier policy matching with `requires_approval: false`: that entry does not merely abstain, it shields every policy declared after it." }
                  matched_policy:    { type: string, nullable: true }
                  risk_level:        { $ref: "#/components/schemas/RiskLevel" }
                  ttl_secs:          { type: integer, nullable: true }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: The token's allowed hosts and tags do not cover the `host` named in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
        "500":
