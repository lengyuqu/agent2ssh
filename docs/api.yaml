  /exec/stream:
    get:
      summary: WebSocket streaming exec
      description: |
        Upgrade to WebSocket. Send an ExecRequest JSON message.
        The stream uses the same SSH command construction and authorization
        path as `/exec`: bearer-token scope, execution gate, execution limits,
        effective risk, and approval policy are enforced before output streams.
        Server pushes: {"type":"stdout","data":"..."}, {"type":"stderr","data":"..."}, {"type":"exit","code":0,"duration_ms":1234}
        The exit frame is sent once the command has run. A request refused
        before it starts — a body that is not an ExecRequest, an unknown source,
        a command over the length limit, a paused gate, a rate limit, a failed
        authorization, `force` missing for a high-risk command, an unknown host —
        answers with a single {"type":"error"} frame and closes the socket, so
        there is no exit frame to wait for after one.
        When the daemon is stopping — `POST /shutdown` or a signal — it pushes
        {"type":"shutdown"} with no other field, drains for up to 500 ms, and closes.
        That frame is the client's only notice that the daemon is going away; it is not
        an error, and reconnecting immediately will race the shutdown. The drain
        forwards stdout and stderr only: an exit that arrives during it is recorded for
        the audit, not sent there. The handler sends its one {"type":"exit"} after the
        loop, which on this path is after the Close — so treat the close as final and
        do not wait for that frame. (A data frame after a close frame is a protocol
        violation; the ordering is L2-87 in `docs/reports/OPT-LOOP-L2-PENDING.md`.)
        Every authorization refusal after the upgrade — scope, execution gate, rate limit, approval — arrives as
        {"type":"error","error":"..."} over the socket, not as an HTTP status: the handler body only counts the
        request and then hands the socket to `on_upgrade`. The only HTTP-level failure is the handshake itself.
        This is why no `429` and no `423` appear below. Both are reachable, but only as a frame, and a response
        entry would hand a generated client a status branch this server never takes. `/terminal` is the
        contrast in the same family: it runs the gate and concurrency checks before the upgrade, so the same
        two refusals *are* HTTP statuses there.
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: "Missing or invalid token: `Authorization: Bearer`, or `?token=` on the upgrade; the same handshake-level check every non-public route runs."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /terminal:
    get:
      summary: WebSocket interactive terminal
      description: |
        Upgrade to WebSocket and attach to an embedded-SSH interactive PTY.
        Query parameters are `host` and `token`; the token is passed in the
        query string because browser WebSocket handshakes cannot set an
        Authorization header. This route and `/exec/stream` are the only ones
        that accept `?token=`; every other route requires `Authorization: Bearer`. The server first sends a JSON text frame:
        {"type":"connected","host":"...","address":"...","username":"...","fingerprint_sha256":"SHA256:...","host_key_algorithm":"...","recording_id":null,"terminal_id":"..."}.
        `recording_id` is null unless terminal recording is enabled, and `terminal_id`
        is the ephemeral ID the broadcast routes accept. The server's pre-authentication
        banner is deliberately not part of this frame — it names the SSH implementation
        and its version — and the transport keeps it only to size SFTP writes.
        Terminal input/output then streams as binary frames. Resize control is
        sent as a JSON text frame: {"type":"resize","cols":120,"rows":36}.
        When the daemon is stopping — `POST /shutdown` or a signal — it sends
        {"type":"shutdown","message":"server shutting down"}, then keeps forwarding
        output until 500 ms pass with no new terminal event, and closes. That 500 ms
        is an idle timeout, not a budget: a terminal that keeps producing output is
        drained until the two-second per-connection deadline in `POST /shutdown`
        drops the loop; a `Closed` or error event, a send that fails, or the
        terminal's event stream ending all end the drain early — the last of those
        sends no diagnostic and looks like a clean finish.
        Note the `message` field: `/exec/stream`'s shutdown frame has
        none, so a client that handles both routes has to accept the two shapes —
        and the same 500 ms means something else there: an absolute deadline
        measured from the cancellation rather than an idle timeout.
        Terminal connections use the embedded SSH transport, including
        jump-host proxy channels, and do not require system `ssh` or `sshpass`.
        Completed input lines are
        authorized before bytes are forwarded to the remote PTY; denied input is
        reported as an error frame and dropped.
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: The host is not a configured profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused. Unlike `/exec/stream`, this route runs the gate check before the upgrade, so the refusal is an HTTP status rather than a WebSocket error frame.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Session concurrency limit exceeded, also checked before the upgrade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /terminal/broadcast/preview:
    post:
      summary: Preview an authenticated multi-terminal broadcast
      description: Resolves live terminal IDs, verifies token ownership, scope, gate, effective risk and approval requirements. It never sends terminal input.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalBroadcastRequest" }
      responses:
        "200":
          description: Per-target safety preview
