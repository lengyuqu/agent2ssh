  /exec/preview:
    post:
      summary: Preview effective risk and approval requirements without executing
      description: Returns the execution plan (per-target effective risk, overall risk, approval requirement, warnings) for a single host or a multi-host/tag selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                host:         { type: string, nullable: true }
                hosts:
                  type: array
                  items: { type: string }
                  nullable: true
                command:      { type: string }
                timeout_secs: { type: integer, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  nullable: true
