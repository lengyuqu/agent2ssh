      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests_total:         { type: integer }
                  exec_total:             { type: integer }
                  exec_blocked_total:     { type: integer }
                  exec_total_duration_ms: { type: integer }
                  approvals_total:
                    type: integer
                    description: >
                      Executions that went to a person for a decision. It is
                      incremented when the wait begins, before any answer, so a
                      request that is rejected, times out, or is cancelled by a
                      shutdown all count. Executions that never ask do not:
                      commands below the risk threshold, and high-risk commands
                      the caller forces past the risk gate — unless an approval
                      policy names them, because a policy asks regardless of
                      `force`. This is therefore "how many times the daemon had
                      to ask", not "how many approvals were granted"; the two
                      differ by every rejection and timeout.

