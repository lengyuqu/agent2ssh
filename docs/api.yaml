  /playbooks/{name}/dry-run:
    post:
      summary: Resolve playbook step templates against params without executing
      description: >-
        `params` is a flat map of string values substituted into each step's
        template; the resolved commands come back and nothing runs. The body is
        read as `Option<Json<…>>`, so a body that does not parse is treated as
        absent and the steps resolve against an empty map instead of being
        refused (see the note on body handling at the top of this document).
        `playbook` duplicates the path parameter and is cross-checked with a 400
        when it parses and disagrees.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                playbook:
                  type: string
                  deprecated: true
                  description: Legacy duplicate of the path parameter; rejected with 400 if it does not match.
                params:
                  type: object
                  additionalProperties: { type: string }
                  nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  playbook: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:             { type: integer }
                        command_template: { type: string }
                        command_resolved: { type: string }
                        params_used:
                          type: array
                          items: { type: string }

        "400":
          description: The playbook path is invalid, or the playbook does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

