        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions:
    post:
      summary: Open a persistent PTY session
      description: Applies bearer-token scope, execution gate, session concurrency limits, effective risk, and approval policy using `session_open`. Direct-host sessions use the embedded SSH terminal worker and remote PTY; connection diagnostics include host-key fingerprint metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionOpenRequest" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List open sessions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:   { type: string, format: uuid }
                    host: { type: string }

  /sessions/{id}/write:
    post:
      summary: Write input to a session
      description: Applies bearer-token scope, execution gate, execution limits, effective risk, and approval policy to the submitted input.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionWriteRequest" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/read:
    get:
      summary: Read buffered output from a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: timeout_ms
          in: query
          schema: { type: integer, default: 2000 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  output: { type: string }

  /sessions/{id}:
    delete:
