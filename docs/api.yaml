openapi: "3.1.0"
info:
  title: Agent2SSH Daemon API
  version: "0.4.5"
  description: >
    Local HTTP API for the Agent2SSH capability layer.

    Two different mechanisms answer 403, and the response text tells them apart.
    An operation documented as `Requires the unrestricted admin token` is gated
    by `require_admin`: only the token in `~/.agent2ssh/daemon.token` passes, and
    any scoped token from `daemon_tokens.toml` is refused regardless of what its
    scope allows. The recording routes carry the sibling gate
    `require_recording_admin`, whose message names terminal recordings. An
    operation whose 403 description names a *scope* or an *approval* instead is a
    per-host permission denial or a rejected approval, not an admin gate.

    One 500 sits outside every operation's own list. `auth_middleware` reads
    `daemon_tokens.toml` for any token that is not the admin token, so a file
    that does not parse answers 500 to that request before any handler runs:
    every non-public route answers 500 to a caller that does not present the
    admin token, while the admin token keeps working. `/approvals/{id}/approve`
    states this once in full rather than repeating it on a hundred operations.

    A request body is read one of three ways, and the three fail differently.
    `Json<T>` — 47 handlers — rejects a body with no `application/json` content
    type as 415, a body that parses but does not fit the schema as 422, and a
    body that is not JSON at all as 400, all before the handler runs.
    `axum::body::Bytes` hands the raw bytes to the handler, which parses them
    itself: `/approvals/{id}/approve` is the only one, and a malformed body there
    is its own 400 rather than 415 or 422. `Option<Json<T>>` is neither. axum's
    rejection for the `Option` wrapper is `Infallible`, so the `.ok()` the
    handlers use turns *every* extraction error into "no body was sent" — a
    wrong content type, invalid JSON, or a field of the wrong type all read as an
    absent body. Three operations read their body that way — `/shutdown`,
    `/playbooks/{name}/dry-run` and `/health-snapshot` — so for those three a
    malformed body is ignored instead of refused, and the operation's own 400
    does not cover it. `/containers/start-service` looks like a fourth and is
    not: its body is a plain `Json<ContainerStartBody>`, so a malformed body
    there is refused like any other `Json<T>` handler. This list names paths,
    and `api_yaml_documents_how_each_handler_reads_its_body` checks it against
    the handlers, because a path added here while its handler reads `Json<T>`
    tells a client that a refuse-that-body endpoint ignores it.

    Two consequences for a client. First, the extractor's own answers are
    `text/plain` carrying axum's message, not the `Error` object: 415 and 422 are
    documented that way on every operation that can produce them, and a body sent
    without a content type is the likeliest way to meet one. Second, a body that
    is not JSON at all reaches the caller as the operation's 400 with that same
    plain-text body, so a client cannot tell "your body was not JSON" from "the
    handler refused what was in it" by the status code — and a client that
    parses every 4xx as `Error` will fail to parse this one. Normalising the
    rejections into the `Error` shape is a daemon change, not a documentation
    one; it is L2-83 in `docs/reports/OPT-LOOP-L2-PENDING.md`.
servers:
  - url: http://127.0.0.1:7722
    description: Local daemon

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Bearer token from `~/.agent2ssh/daemon.token` or a scoped token configured in `~/.agent2ssh/daemon_tokens.toml`.

  schemas:
    ContainerServiceStart:
      type: object
      required: [runtime, display_name, started]
      properties:
        runtime:      { type: string }
        display_name: { type: string }
        started:      { type: boolean, description: "false when the service was already up, so nothing was spawned" }
        start_command: { type: string, nullable: true }

    HostProfile:
      type: object
      required: [name, host]
      properties:
        name:      { type: string }
        host:      { type: string }
        user:      { type: string, nullable: true }
        port:      { type: integer, nullable: true }
        key_path:  { type: string, nullable: true }
        password:  { type: string, nullable: true, writeOnly: true, description: "Accepted on write; every read path calls `redacted_for_transport`, so this is always null in a response." }
        jump_host: { type: string, nullable: true }
        risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }
        tags:
          type: array
          items: { type: string }
        env:       { type: string, nullable: true }
        role:      { type: string, nullable: true }
        owner:     { type: string, nullable: true }
        proxy_id:  { type: string, nullable: true, description: "Proxy profile id used for the TCP connection to this host." }
        group:     { type: string, description: "UI grouping bucket. A value that is not one of the configured group ids is reset to `default` when the config is normalized, so a group must be registered before a host can name it." }
        init_command: { type: string, nullable: true, description: "Command run in the remote shell immediately after connect (OpenSSH `RemoteCommand`)." }
        passphrase: { type: string, nullable: true, writeOnly: true, description: "Passphrase for an encrypted private key; accepted on write, persisted as a secret reference in hosts.json, and always null in a response for the same reason as password." }
        ai_allowed: { type: boolean, default: true, description: "false = human-only host; AI/automation sources are refused" }

    ExecRequest:
      type: object
      required: [host, command]
      properties:
        host:             { type: string }
        command:          { type: string }
        force:            { type: boolean, default: false }
        timeout_secs:     { type: integer, nullable: true }
        stdin:            { type: string, nullable: true }
        max_output_bytes: { type: integer, nullable: true }
        reason:           { type: string, nullable: true }
        change_id:        { type: string, nullable: true }
        side_effect:      { type: string, nullable: true, description: "Caller-declared impact, e.g. `triggers a Full GC, 100-300ms pause`. Surfaced on the approval card and recorded in the audit trail." }
        source:           { type: string, nullable: true }

    ExecResult:
      type: object
      properties:
        host:        { type: string }
        command:     { type: string }
        exit_code:   { type: integer, nullable: true }
        stdout:      { type: string }
        stderr:      { type: string }
        duration_ms: { type: integer }
        risk_level:  { $ref: "#/components/schemas/RiskLevel" }
        truncated:   { type: boolean }
        dropped_bytes: { type: integer, default: 0, description: "Bytes removed by truncation. Truncation keeps the head and the tail and drops the middle, so this is the exact size of the gap." }
        side_effect:   { type: string, nullable: true, description: "Echoed from the request so the caller sees what was recorded in the audit trail." }
        risk_unclassified: { type: boolean, description: "Present only when true: `risk_level` is a bash verdict about a command the target interprets in another language, so it is a flag rather than a trustworthy level." }

    ExecMultiResult:
      type: object
      properties:
        host:   { type: string }
        result: { $ref: "#/components/schemas/ExecResult", nullable: true }
        error:  { type: string, nullable: true }

    ExecMultiRequest:
      type: object
      required: [hosts, command]
      properties:
        hosts:
          type: array
          items: { type: string }
        command:      { type: string }
        force:        { type: boolean, default: false }
        timeout_secs: { type: integer, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        strategy:
          type: object
          nullable: true
          properties:
            concurrency: { type: integer, nullable: true }
            max_failures: { type: integer, nullable: true }
            batch_size: { type: integer, nullable: true }
            pause_between_batches_secs: { type: integer, nullable: true }
        reason:       { type: string, nullable: true }
        change_id:    { type: string, nullable: true }
        source:       { type: string, nullable: true }

    ExecMultiBatchResult:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ExecMultiResult" }
        total_hosts:       { type: integer }
        successful:        { type: integer }
        failed:            { type: integer }
        skipped:           { type: integer }
        stopped_early:     { type: boolean }
        batches_executed:  { type: integer }
        total_duration_ms: { type: integer }

    ExecCompareRequest:
      type: object
      required: [hosts, command]
      properties:
        hosts:
          type: array
          items: { type: string }
        command:      { type: string }
        force:        { type: boolean, default: false }
        timeout_secs: { type: integer, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }

    ExitCodeGroup:
      type: object
      properties:
        exit_code: { type: integer, nullable: true }
        hosts:
          type: array
          items: { type: string }

    OutputDiff:
      type: object
      properties:
        host: { type: string }
        output_summary: { type: string }
        differs_from_first: { type: boolean }

    OutputComparison:
      type: object
      properties:
        identical: { type: boolean }
        common_prefix: { type: string }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/OutputDiff" }

    ExecComparison:
      type: object
      properties:
        hosts_count: { type: integer }
        exit_code_groups:
          type: array
          items: { $ref: "#/components/schemas/ExitCodeGroup" }
        stdout_comparison: { $ref: "#/components/schemas/OutputComparison" }
        stderr_comparison: { $ref: "#/components/schemas/OutputComparison" }
        summary: { type: string }

    PingResult:
      type: object
      properties:
        host:       { type: string }
        reachable:  { type: boolean }
        latency_ms: { type: integer, nullable: true }
        error:      { type: string, nullable: true }

    RiskLevel:
      type: string
      enum: [low, medium, high, blocked]

    DaemonScope:
      type: object
      description: Optional least-privilege scope for daemon tokens or remote daemon aliases.
      properties:
        allowed_hosts:
          type: array
          items: { type: string }
          description: Allowed host names. Empty means all hosts.
        allowed_tags:
          type: array
          items: { type: string }
          description: Allowed host tags. Empty means all tags.
        allowed_commands:
          type: array
          items: { type: string }
          description: Allowed command or operation patterns. Empty means all commands.
        denied_commands:
          type: array
          items: { type: string }
          description: Denied command or operation patterns, checked before allowed patterns.

    AuditEntry:
      type: object
      properties:
        id:          { type: string, format: uuid }
        ts:          { type: string, format: date-time }
        host:        { type: string }
        command:     { type: string }
        exit_code:   { type: integer, nullable: true }
        duration_ms: { type: integer }
        risk_level:  { $ref: "#/components/schemas/RiskLevel" }
        reason:      { type: string, nullable: true }
        change_id:   { type: string, nullable: true }
        source:      { type: string, nullable: true }
        decision:
          type: string
          nullable: true
          enum: [approved, approved_rewritten, rejected, timed_out, auto_allowed, blocked]
          description: >
            Authorization verdict; absent on older entries and on operations that
            never ran. `approved_rewritten` means a human approved a *different*
            command than the one requested — read it against `original_command`. It
            is kept distinct from `approved` because the substitution is checked by
            risk *level*, so an edit can change what a command does without changing
            how it ranks.
        decided_by:
          type: string
          nullable: true
          description: "human, rule or timeout"
        original_command:
          type: string
          nullable: true
          description: "The command as requested, when the approver ran a rewritten one (then `command` is what ran)"
        side_effect: { type: string, nullable: true, description: "Caller-declared impact for this entry" }
        action:      { type: string, nullable: true, description: "Operation category, e.g. exec, sftp_upload, forward_add, config_update" }
        outcome:     { type: string, nullable: true, description: "success, blocked, error or timeout, derived from exit_code and risk_level" }
        risk_unclassified: { type: boolean, description: "Present only when true: the recorded risk level is not a trustworthy verdict (see ExecResult)" }

    AgentEvent:
      type: object
      properties:
        id:         { type: string, format: uuid }
        event_type:
          type: string
          description: >-
            The first frame of every `/events/stream` subscription is
            `stream_connected`, so a `match` that omits it hits an unknown
            branch on the very first message. `host_connected`,
            `host_disconnected` and `config_changed` are defined but have no
            publisher today; do not wait on them.
          enum:
            - stream_connected
            - exec_started
            - exec_output
            - exec_completed
            - approval_requested
            - approval_responded
            - host_connected
            - host_disconnected
            - session_opened
            - session_input
            - session_output
            - session_closed
            - audit_rotated
            - config_changed
            - gate_changed
            - gate_rejected
            - limit_rejected
            - anomaly_detected
        timestamp:  { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true

    AuditFilter:
      type: object
      description: >-
        The query-parameter set of `/audit` and `/audit/export` as one object —
        OpenAPI cannot `$ref` an object into `parameters`, so both routes spell
        the thirteen fields out and this schema is where they are described
        once. The struct also carries a fourteenth field, `host_scope`, which
        the daemon fills from the caller's token before it reads; it is
        `#[serde(skip)]` and never accepted from the wire.
      properties:
        host:            { type: string, nullable: true }
        risk_level:      { $ref: "#/components/schemas/RiskLevel", nullable: true }
        exit_code:       { type: integer, nullable: true }
        since:           { type: string, format: date-time, nullable: true }
        until:           { type: string, format: date-time, nullable: true }
        limit:           { type: integer, default: 20 }
        search:          { type: string, nullable: true, description: "Full-text search across the command, host and other text fields." }
        command_pattern: { type: string, nullable: true, description: "Glob-style match on the command, `*` and `?` only." }
        host_env:        { type: string, nullable: true, description: "Host `env` label." }
        host_role:       { type: string, nullable: true, description: "Host `role` label." }
        host_owner:      { type: string, nullable: true, description: "Host `owner` label." }
        decision:
          type: string
          nullable: true
          enum: [approved, approved_rewritten, rejected, timed_out, auto_allowed, blocked]
          description: Only entries with this authorization verdict.
        agent:           { type: string, nullable: true, description: "Exact, case-insensitive match on the requesting client's `source`." }

    SftpUploadRequest:
      type: object
      required: [host, local_path, remote_path]
      properties:
        host:        { type: string }
        local_path:  { type: string }
        remote_path: { type: string }
        resume:      { type: boolean, default: false, description: "K6: append from the remote file's current length instead of re-sending from byte 0" }
        transfer_id: { type: string, nullable: true, description: "K6: opaque id that registers a cancel flag inside the process running the transfer. Nothing in this API can flip that flag — the only entry point is the desktop app's `sftp_cancel` IPC, in the same process — so an id passed to this route does not make the upload cancellable over HTTP. Absent means no flag is registered at all." }

    SftpDownloadRequest:
      type: object
      required: [host, remote_path, local_path]
      properties:
        host:        { type: string }
        remote_path: { type: string }
        local_path:  { type: string }
        resume:      { type: boolean, default: false, description: "K6: continue an interrupted download from the bytes already on disk instead of re-fetching from byte 0. The partial file is `<local_path>.part`; when there is none, a `<local_path>` left by an earlier run is renamed to it and continued. When the bytes on disk already reach or exceed the remote size, the transfer restarts from 0 rather than appending a corrupt tail." }
        transfer_id: { type: string, nullable: true, description: "K6: opaque id that registers a cancel flag inside the process running the transfer. As with uploads, only the desktop app's `sftp_cancel` IPC in that same process can flip it; there is no HTTP cancel route, so passing an id here does not make the download cancellable." }
        max_mb:      { type: integer, nullable: true, description: "G8: hard cap on the remote file size in MiB (100 when absent); larger files are refused with advice to use scp/rsync" }

    SftpResult:
      type: object
      properties:
        host:        { type: string }
        local_path:  { type: string }
        remote_path: { type: string }
        direction:   { type: string, enum: [upload, download] }
        duration_ms: { type: integer }
        bytes:       { type: integer, description: "J5: bytes transferred, so a caller can report volume rather than file count" }

    SessionOpenRequest:
      type: object
      required: [host]
      properties:
        host: { type: string }
        source: { type: string, nullable: true }

    SessionWriteRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: >
            Raw keystrokes for the session's shell. There is no `command`
            field: the handler derives one by splitting `input` at newlines and
            running scope, gate, limits, risk and approval over the last
            complete line before it writes anything. Any other field in the
            body is ignored rather than rejected (`SessionWriteBody` in the
            daemon does not use `deny_unknown_fields`), so a client that sends
            `command` gets its input through with the risk derived from
            `input`, not from what it sent.
        force:
          type: boolean
          default: false
          description: Applied to the command risk of the split-out input.
        source: { type: string, nullable: true }

    ForwardAddRequest:
      type: object
      description: >-
        The five fields the handler reads. The body is deserialized into the
        server's own `ForwardRule`, so `id`, `name`, `group_id` and `via` are
        accepted without a 400 and then ignored: a jump host goes in the `via`
        query parameter, and a named or grouped rule goes through
        `POST /forwards/multi` or the desktop app.
      required: [host, direction, bind_port, target_host, target_port]
      properties:
        host:        { type: string }
        direction:   { type: string, enum: [local, remote] }
        bind_port:   { type: integer }
        target_host: { type: string }
        target_port: { type: integer }

    ForwardRule:
      type: object
      properties:
        id:          { type: string, format: uuid }
        host:        { type: string }
        direction:   { type: string, enum: [local, remote] }
        bind_port:   { type: integer }
        target_host: { type: string }
        target_port: { type: integer }
        name:        { type: string, nullable: true, description: "Human-readable label, serialized as null when unset (`ForwardRule.name` is an `Option`, with no `skip_serializing_if`). Rules created by `POST /forwards` always carry null here, because that handler reads five fields and ignores this one; `/forwards/multi` and the desktop app can set it." }
        group_id:    { type: string, nullable: true, description: "Optional group id, mirroring host groups; null when unset. Same caveats as `name`: `POST /forwards` ignores it, `/forwards/multi` accepts it." }
        via:         { type: string, nullable: true, description: "Jump-host alias captured when the tunnel was created through `?via=`, so `/forwards/{id}/start` re-establishes the same path after a stop. Null means the host profile's own `jump_host` applies; non-null **replaces** it for this tunnel (`resolve_host_with_jump` overwrites `host.jump_host`), so a rule built with `?via=b` no longer uses the profile's configured jump host. An alias that is not a known host profile is rejected." }

    ConnectionStatus:
      type: object
      properties:
        host:        { type: string }
        connected:   { type: boolean }
        socket_path: { type: string, nullable: true }
        # K5 connection self-healing: liveness/reconnect state from the supervisor.
        healthy:      { type: boolean, description: "Last keepalive probe succeeded (distinct from connected)." }
        reconnecting: { type: boolean, description: "Supervisor is re-establishing a dropped connection." }
        last_error:   { type: string, nullable: true, description: "Last keepalive/reconnect error." }

    ApprovalRequest:
      type: object
      properties:
        id:           { type: string, format: uuid }
        host:         { type: string }
        command:      { type: string }
        risk_level:   { $ref: "#/components/schemas/RiskLevel" }
        requested_at: { type: string, format: date-time }
        ttl_secs:     { type: integer, description: "TTL in seconds before auto-expiry" }
        status:       { type: string, enum: [pending, approved, rejected, timed_out, revoked], description: "`revoked` is written when an already-approved request is withdrawn; today only in-process callers produce it, there is no HTTP route for it." }
        rewritten_command: { type: string, nullable: true, description: "Set when the approver approved a different command; that is what ran" }
        revoked_at:    { type: string, format: date-time, nullable: true, description: "Set when an already-approved request is withdrawn; no HTTP route produces it today" }
        approved_command_snapshot: { type: string, nullable: true, description: "Command text captured at approval time, so the approved command survives a later change to `command`; holds the rewritten text when one was approved" }
        context:
          type: object
          nullable: true
          description: "Rich review context captured when the request was raised"
          properties:
            host_address: { type: string, nullable: true }
            host_env:     { type: string, nullable: true }
            host_role:    { type: string, nullable: true }
            source:       { type: string, nullable: true, description: "Requesting client label (cli, mcp, daemon, AGENT2SSH_SOURCE)" }
            reason:       { type: string, nullable: true }
            change_id:    { type: string, nullable: true }
            rewritable:   { type: boolean, description: "The approver may approve a rewritten command instead (POST /approvals/{id}/approve with a body)" }
            recent_commands:
              type: array
              description: Recent executions on this host, captured for the reviewer; empty rather than absent when none were collected
              items:
                type: object
                properties:
                  command:    { type: string }
                  exit_code:  { type: integer, nullable: true }
                  risk_level: { $ref: "#/components/schemas/RiskLevel" }
                  ts:         { type: string, description: "ISO-8601 timestamp string" }
            risk_details:
              type: object
              nullable: true
              properties:
                built_in_risk:      { $ref: "#/components/schemas/RiskLevel" }
                user_risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }
                final_risk:         { $ref: "#/components/schemas/RiskLevel" }
                matched_policy:     { type: string, nullable: true }
                risk_unclassified:  { type: boolean, description: "The levels came from the bash classifier applied to a command written in another language" }

    HostPolicySummary:
      type: object
      properties:
        host:       { type: string }
        ai_allowed: { type: boolean, description: "false = AI/automation sources are refused (desktop and cli stay allowed)" }
        risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }
        low:    { $ref: "#/components/schemas/ApprovalMode" }
        medium: { $ref: "#/components/schemas/ApprovalMode" }
        high:   { $ref: "#/components/schemas/ApprovalMode" }
        policies:
          type: array
          description: Names of approval policies that apply to this host
          items: { type: string }
        blocked_patterns:
          type: array
          description: User-defined patterns classified as blocked; built-in rules apply on top
          items: { type: string }

    ApprovalMode:
      type: string
      enum: [auto, required, conditional]

    ApprovalResponse:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }

    WebhookConfig:
      type: object
      properties:
        url: { type: string, nullable: true }
        events:
          type: array
          items: { type: string }
        secret: { type: string, nullable: true }

    Playbook:
      type: object
      description: >-
        A playbook carries either plain commands in `steps` or parameterised
        steps in `advanced_steps`; when `advanced_steps` is present it wins and
        `steps` may be empty. A response with `"steps": []` and a populated
        `advanced_steps` is valid, not a broken playbook.
      properties:
        name:        { type: string }
        description: { type: string }
        steps:
          type: array
          items: { type: string }
          description: "Commands run in order. Empty when the playbook uses `advanced_steps`."
        tags:
          type: array
          items: { type: string }
        risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }
        advanced_steps:
          type: array
          items: { $ref: "#/components/schemas/PlaybookStep" }
          nullable: true
          description: "Omitted when unused. Takes precedence over `steps`."

    PlaybookStep:
      type: object
      required: [command]
      properties:
        command:     { type: string, description: "Command text; `{{name}}` placeholders are filled from `params`." }
        description: { type: string, nullable: true }
        params:
          type: array
          items: { $ref: "#/components/schemas/PlaybookParam" }
          description: "Defaults to an empty list when omitted."

    PlaybookParam:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }
        default:     { type: string, nullable: true }
        required:    { type: boolean, default: false }

    PlaybookRunRequest:
      type: object
      required: [playbook, host]
      properties:
        playbook: { type: string }
        host:     { type: string }
        force:    { type: boolean, default: false }
        params:
          type: object
          nullable: true
          additionalProperties: { type: string }
        reason:   { type: string, nullable: true }
        change_id: { type: string, nullable: true }
        source:   { type: string, nullable: true }

    PlaybookStepResult:
      type: object
      properties:
        step:    { type: integer }
        command: { type: string }
        result:  { $ref: "#/components/schemas/ExecResult", nullable: true }
        error:   { type: string, nullable: true }

    PlaybookRunResult:
      type: object
      properties:
        playbook:          { type: string }
        host:              { type: string }
        steps_completed:
          type: array
          items: { $ref: "#/components/schemas/PlaybookStepResult" }
        success:           { type: boolean }
        total_duration_ms: { type: integer }

    DaemonInfo:
      type: object
      properties:
        alias:     { type: string }
        url:       { type: string }
        connected: { type: boolean }
        scope:
          $ref: "#/components/schemas/DaemonScope"
          description: >-
            Omitted entirely when no scope is configured — the key is absent,
            not `null`. `WebDavSyncStatus` uses the opposite convention, so a
            reader checking for `scope === null` never sees it.

    ExecutionGateStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [active, paused]
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, nullable: true }
        reason:     { type: string, nullable: true }

    GateUpdate:
      type: object
      properties:
        source: { type: string, nullable: true }
        reason: { type: string, nullable: true }

    DaemonDiagnostic:
      type: object
      properties:
        alias: { type: string }
        url:   { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name:    { type: string }
              status:  { type: string, enum: [ok, warning, error] }
              message: { type: string }
              details: { type: string, nullable: true }
        overall_status: { type: string, enum: [ok, warning, error] }

    TeamConfigExport:
      type: object
      description: Shareable configuration bundle. Host profiles are exported with `key_path`, `password` and `passphrase` stripped; everything else, including `proxy_id`, is carried as-is.
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/HostProfile" }
        risk_rules: { type: string, nullable: true, description: "Raw risk_rules.toml content" }
        playbooks:  { type: string, nullable: true, description: "Raw playbooks.toml content" }

    TerminalBroadcastRequest:
      type: object
      required: [targets, command]
      properties:
        targets:
          type: array
          minItems: 2
          maxItems: 32
          items:
            type: object
            required: [terminal_id, host]
            properties:
              terminal_id: { type: string, format: uuid }
              host: { type: string }
        command: { type: string, description: Single command without control characters; the server appends Enter. }
        force: { type: boolean, default: false }
        all_or_nothing: { type: boolean, default: true }
    TerminalBroadcastResponse:
      type: object
      required: [broadcast_id, enqueued_any, all_or_nothing, targets]
      properties:
        broadcast_id: { type: string, format: uuid }
        enqueued_any: { type: boolean }
        all_or_nothing: { type: boolean }
        targets:
          type: array
          items:
            type: object
            properties:
              terminal_id: { type: string, format: uuid }
              host: { type: string }
              risk_level: { type: string, enum: [low, medium, high, blocked] }
              requires_approval:
                type: boolean
                description: "Whether this command needs a person's decision on this host, from risk and the approval policies. Both routes report it; only `/terminal/broadcast` actually waits for the answer."
              matched_policy: { type: string, nullable: true }
              authorized:
                type: boolean
                description: "Preflight verdict: true means this target passed scope, the execution gate, the risk block and the rate limit. On `/terminal/broadcast/preview` it grants nothing — the route sends no input and raises no approval card, so `authorized: true` with `requires_approval: true` only means \"nothing refused it yet\". On `/terminal/broadcast` a refusal after preflight, including a rejected or timed-out approval, flips it to false."
              approval_granted:
                type: boolean
                description: "Only ever true on `/terminal/broadcast`, when an approver granted this target during this request. A preview always answers false because it never asks."
              sent: { type: boolean, description: Enqueued to the live terminal; does not mean remote completion. }
              error: { type: string, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }

    ApprovalPolicy:
      type: object
      required: [name]
      properties:
        name:         { type: string, description: "Human-readable policy name" }
        hosts:
          type: array
          items: { type: string }
          description: "Host names this policy applies to; empty means every host. Matching is case-insensitive."
        tags:
          type: array
          items: { type: string }
          description: "Host tags; any match applies the policy. Empty means every tag."
        min_risk:       { $ref: "#/components/schemas/RiskLevel", nullable: true, description: "Lowest risk level that triggers approval. Absent means any level." }
        command_pattern: { type: string, nullable: true, description: "Glob pattern (`*`, `?`) the command must match for the policy to apply" }
        requires_approval: { type: boolean, default: true, description: "true routes the match to an approver. false makes this policy ask for nothing *and stops the search*, so a later policy that would have demanded approval is never consulted — the first matching policy decides. Neither value overrides the high-risk rule: `/exec` still demands an approval (or `force: true`) for a high-risk command, whatever a policy says." }
        ttl_secs:       { type: integer, nullable: true, description: "Approval TTL for requests created by this policy" }

    DaemonHealthSummary:
      type: object
      properties:
        version:     { type: string, nullable: true }
        uptime_secs: { type: integer, nullable: true }
        pid:         { type: integer, nullable: true }

    DaemonMetricsSummary:
      type: object
      properties:
        request_count:       { type: integer, nullable: true }
        exec_count:          { type: integer, nullable: true }
        exec_blocked_count:  { type: integer, nullable: true }
        approval_count:
          type: integer
          nullable: true
          description: >
            The same number `GET /metrics` reports as `approvals_total`, carried
            under a shorter name. It counts executions that asked a person for a
            decision and is incremented when the wait begins, so rejections,
            timeouts and shutdown cancellations all raise it; approvals granted
            do not, in themselves. Read it as "how often the daemon had to ask",
            never as "how many approvals were granted".

    DaemonViewEntry:
      type: object
      required: [alias, url, connected]
      properties:
        alias:      { type: string }
        url:        { type: string }
        connected:  { type: boolean }
        host_count: { type: integer, nullable: true, description: "Absent while the daemon is unreachable" }
        health:     { $ref: "#/components/schemas/DaemonHealthSummary", nullable: true }
        metrics:    { $ref: "#/components/schemas/DaemonMetricsSummary", nullable: true }

    DaemonUnifiedView:
      type: object
      required: [daemons, total_hosts, total_connected]
      properties:
        daemons:
          type: array
          items: { $ref: "#/components/schemas/DaemonViewEntry" }
        total_hosts:     { type: integer }
        total_connected: { type: integer }

    VersionCompatibility:
      type: object
      required: [local_version, compatible, message]
      properties:
        local_version:  { type: string }
        remote_version: { type: string, nullable: true, description: "Absent when the remote daemon did not answer /health" }
        compatible:     { type: boolean }
        message:        { type: string }

    AlgoPrefsState:
      type: object
      required: [prefs, custom, defaults]
      properties:
        prefs:    { $ref: "#/components/schemas/SshAlgoPrefs" }
        custom:
          type: boolean
          description: >-
            True when `ssh_algos.json` exists **and parses**. A file that
            exists but fails to parse reports `false` and the connection path
            falls back to the defaults, so `false` does not prove the file is
            absent.
        defaults: { $ref: "#/components/schemas/SshAlgoPrefs" }

    SshSyncHostDiff:
      type: object
      required: [name, host]
      properties:
        name: { type: string }
        host: { type: string }
        user: { type: string, nullable: true }
        port: { type: integer, nullable: true }

    SshSyncHostConflict:
      type: object
      required: [name, field, agent2ssh_value, ssh_config_value]
      properties:
        name: { type: string }
        field: { type: string, description: "The HostProfile field that differs, for example `port`." }
        agent2ssh_value: { type: string }
        ssh_config_value: { type: string }

    SshSyncDiff:
      type: object
      required: [only_in_agent2ssh, only_in_ssh_config, conflicts, matching, summary]
      properties:
        only_in_agent2ssh: { type: array, items: { $ref: "#/components/schemas/SshSyncHostDiff" } }
        only_in_ssh_config: { type: array, items: { $ref: "#/components/schemas/SshSyncHostDiff" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/SshSyncHostConflict" } }
        matching: { type: array, items: { type: string } }
        summary: { type: string, description: "Human-readable one-liner, not a machine-stable format." }

    RecordingConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, default: false, description: "Opt-in: terminal output may contain secrets, so recording stays off until it is turned on." }

    RecordingInfo:
      type: object
      description: >
        Metadata for one asciicast v2 recording. The struct carries
        `rename_all = "camelCase"`, so the wire names are `createdAt`,
        `durationSeconds` and `sizeBytes` — not the snake_case the Rust field
        names would suggest. `id` is the recording's UUID and the only form
        `/recordings/{id}` accepts; a path or a bare filename is rejected before
        the filesystem is touched.
      required: [id, host, createdAt, durationSeconds, width, height, sizeBytes]
      properties:
        id:              { type: string, format: uuid }
        host:            { type: string }
        createdAt:       { type: string, format: date-time }
        durationSeconds: { type: number }
        width:           { type: integer }
        height:          { type: integer }
        sizeBytes:       { type: integer }

    RecordingContent:
      type: object
      description: A recording read back whole — metadata and body in one response.
      required: [info, content]
      properties:
        info:    { $ref: "#/components/schemas/RecordingInfo" }
        content: { type: string, description: "The asciicast v2 JSONL body, verbatim." }

    SshAlgoPrefs:
      type: object
      description: >
        Eight comma-separated algorithm lists in preference order — what a
        handshake offers. Validation is fail-closed: one name the backend
        cannot negotiate makes every connection fail, so the built-in defaults
        are filtered down to what this build supports rather than copied from
        a wish list.
      required: [kex, hostkey, cipher_cs, cipher_sc, mac_cs, mac_sc, comp_cs, comp_sc]
      properties:
        kex:       { type: string }
        hostkey:   { type: string }
        cipher_cs: { type: string }
        cipher_sc: { type: string }
        mac_cs:    { type: string }
        mac_sc:    { type: string }
        comp_cs:   { type: string, description: "Exactly `none` — the only value this build can negotiate. An empty list is rejected here as it is in every other field, so the usual 「empty means default」 reading does not apply." }
        comp_sc:   { type: string, description: "Exactly `none`, same reason as `comp_cs`." }

    Snippet:
      type: object
      description: >
        A named command. `POST /snippets` replaces the whole entry when the
        name already exists, so a caller that omits `description` clears it
        instead of keeping the previous one.
      required: [name, command]
      properties:
        name:        { type: string, description: "Identity: trimmed, at most 128 characters, no control characters." }
        command:     { type: string, description: "At most 64 KiB. Deliberately kept out of error messages, because snippets often carry credentials." }
        description: { type: string, description: "At most 4 KiB. Omitted from responses when unset." }

    RedactRuleInfo:
      type: object
      description: The on-disk rule plus `is_builtin`. A rule's identity is its pattern; there is no id.
      required: [pattern, replacement, is_builtin]
      properties:
        pattern:     { type: string, description: "Regex source; also the identity key." }
        replacement: { type: string, description: "Literal text, used verbatim — capture groups are not expanded." }
        is_builtin:  { type: boolean, description: "True for one of the patterns the app ships with." }

    HighlightRule:
      type: object
      description: >-
        A whole rule. `POST /highlight/rules/update` sends one of these as the
        `rule` field, so the caller reads the rule first and sends back the
        fields it wants unchanged — there is no partial update.
      required: [keyword, name, color, enabled, is_regex, is_case_sensitive]
      properties:
        keyword:           { type: string, description: "Regex source; also the identity key." }
        name:              { type: string, description: "Label, at most 100 characters." }
        color:             { type: string, description: "`#RRGGBB`." }
        enabled:           { type: boolean }
        is_regex:          { type: boolean, description: "Always true after migration: legacy plain-text rules were escaped." }
        is_case_sensitive: { type: boolean }

    WebDavSyncFile:
      type: object
      required: [path, bytes, sha256]
      properties:
        path:   { type: string }
        bytes:  { type: integer }
        sha256: { type: string }

    WebDavSyncMarker:
      type: object
      description: One side's sync marker. `digest` and `object_prefix` are the only keys an older marker may omit.
      required: [schema_version, global_version, sync_id, updated_at, app_version, direction, files]
      properties:
        schema_version: { type: integer }
        global_version: { type: integer }
        sync_id:        { type: string }
        updated_at:     { type: string, description: "RFC 3339." }
        app_version:    { type: string }
        direction:      { type: string }
        files:          { type: array, items: { $ref: "#/components/schemas/WebDavSyncFile" } }
        digest:         { type: string, description: "Stable digest of the configuration `files` describes. Older markers omit it; their digest is derived from the manifest on read." }
        object_prefix:  { type: string, description: "Prefix for the immutable version objects. Schema v1 omitted it and used the mutable `files/` directory." }

    WebDavSyncStatus:
      type: object
      description: >
        Every key is always present — the optional ones are sent as `null`
        rather than omitted, so a client never has to distinguish "absent" from
        "unknown". This is the `webdav_sync` struct the daemon serializes, not
        the desktop-only `WebDavSyncStatus` in `tauri_commands.rs`, which has
        different fields and camelCase names. Every key here is always
        present and `null` means unknown; `DaemonInfo.scope` is the opposite
        convention (absent when unset), so do not "unify" the two.
      required: [local, remote, state, local_digest, remote_digest, base_digest, summary, metadata_error]
      properties:
        local:
          $ref: "#/components/schemas/WebDavSyncMarker"
          description: "`null` until this machine has written a marker."
        remote:
          $ref: "#/components/schemas/WebDavSyncMarker"
          description: "`null` until the server has a marker, or when it could not be read — `metadata_error` says which."
        state:
          type: string
          enum: [in_sync, local_ahead, remote_ahead, diverged, unknown]
        local_digest:   { type: string, nullable: true }
        remote_digest:  { type: string, nullable: true }
        base_digest:    { type: string, nullable: true, description: "The last digest both sides agreed on; `null` before a first successful sync." }
        summary:        { type: string }
        metadata_error: { type: string, nullable: true }

    RiskDistribution:
      type: object
      required: [low, medium, high, blocked]
      properties:
        low:     { type: integer }
        medium:  { type: integer }
        high:    { type: integer }
        blocked: { type: integer }

    HostExecutionCount:
      type: object
      required: [host, count]
      properties:
        host:  { type: string }
        count: { type: integer }

    HourlyBucket:
      type: object
      required: [hour, count, failures]
      properties:
        hour:     { type: string, description: "ISO 8601, truncated to the hour." }
        count:    { type: integer }
        failures: { type: integer }

    MetricsTrend:
      type: object
      required: [period, total_executions, success_count, failure_count, blocked_count, failure_rate, risk_distribution, avg_duration_ms, top_hosts, hourly_breakdown]
      properties:
        period:
          type: string
          enum: [last24h, last7d, last30d, all]
          description: >
            The window covered. The tokens are not the request's: `?period=24h`
            comes back as `last24h`. The daemon accepts either spelling on the
            way in, so a caller echoing the response value back still works.
        total_executions:  { type: integer }
        success_count:     { type: integer }
        failure_count:     { type: integer }
        blocked_count:     { type: integer }
        failure_rate:      { type: number, description: "A ratio between 0 and 1, not a percentage." }
        risk_distribution: { $ref: "#/components/schemas/RiskDistribution" }
        avg_duration_ms:   { type: number }
        top_hosts:         { type: array, items: { $ref: "#/components/schemas/HostExecutionCount" } }
        hourly_breakdown:  { type: array, items: { $ref: "#/components/schemas/HourlyBucket" } }

paths:

  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, pid]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  uptime_secs: { type: integer }
                  config_dir_available: { type: boolean }
                  embedded_ssh_available: { type: boolean }
                  embedded_keygen_available: { type: boolean }
                  ssh_available:
                    type: boolean
                    deprecated: true
                    description: Backward-compatible alias; runtime SSH uses the embedded backend.
                  pid: { type: integer }
                  config_dir:
                    type: string
                    description: >
                      Absolute path of the config directory this daemon serves.
                      The stop path compares it with its own before requesting a
                      shutdown, so a daemon started with a different
                      `AGENT2SSH_CONFIG_DIR` is told apart from the one the caller
                      started.

  /shutdown:
    post:
      summary: Shut the daemon down
      description: >
        Asks the daemon to shut down the way `SIGTERM` does: it stops accepting
        connections, ends event streams, and drains open WebSocket connections on
        a budget — up to two seconds for each connection (they drain in parallel),
        then up to four seconds for the registry that tracks them. A connection
        that misses its deadline stops being waited for: its drain loop is
        dropped and the handler finishes its own cleanup, which can take up to
        another half second. The drain is therefore best effort, not a guarantee.
        It then removes `daemon.pid`. Everything the daemon holds in memory ends
        with it — PTY sessions, resident shells, port forwards and pending
        approvals. A pending approval is not left ambiguous: the wait behind it
        is cancelled, the approval is answered `rejected` while it is still
        pending, and `audit.jsonl` gets a
        `daemon shutting down; approval wait cancelled` line — so "the daemon was
        stopped" is not indistinguishable from "nobody ever answered". That trace
        only exists for a stop the daemon completes itself: one that is
        force-terminated after the grace window, or killed outright, writes
        nothing on its way out.
        The desktop app and `agent2ssh daemon stop` use this route on all
        platforms, but stopping is two steps rather than one: this request, and —
        only once a daemon has accepted it and is still running when the wait ends —
        a force-terminate. A request that never gets an accepted answer ends the
        attempt instead: the caller reports why and sends no signal, so a refused
        connection and every 4xx this operation can answer leave the process
        alone. Who answered what is worth separating. A `409` means another daemon
        holds the listener: the PID in `expect_pid` is not the one that replied.
        A `401` — or the `403` of the admin gate, which the caller treats the same
        way — means this route did reply: the token in this config's `daemon.token`
        is not the one the running daemon accepts as admin, which is what a file
        replaced under it looks like.
        A `429` is neither: the request was understood and refused for
        rate-limiting, before this handler ran, because `/shutdown` is subject to
        the execution limits like every other route. Those counts are per minute
        and default to 30 per source and 20 per host — the host being the name the
        request carries, e.g. `local:vs` — and they are configurable in
        `execution_limits.toml`, so a busy stop loop meets one before any of the
        answers above. And the stop path's own pre-flight refusals — no `/health`
        answer, another PID, another config directory, no token file at all —
        never connect, so no status code describes them.
        The caller waits
        `GRACEFUL_STOP_WAIT` (8 s) for the process to exit; on `Running` it records
        a warning, signals the process by force, then waits 2 more seconds, and a
        `StillRunning` observation at that point is an error rather than a silent
        success. Before the request it compares the PID `/health` reports with the
        PID it was asked to stop, and with the config directory that daemon says it
        serves; a disagreement ends the attempt as an identity error without
        waiting, so this is not "always check health, then stop".
        Requires the unrestricted admin token; a scoped token gets 403.

        The optional `expect_pid` names the process the caller means to stop. It
        is re-checked here rather than trusted: the listener can change hands
        between a health check and this request — a restart, a respawn — and the
        daemon that answers the second request accepts the same admin token
        because the token is a file in the shared config directory. A request
        naming a different PID is refused with 409 and this daemon keeps running.
        `expect_pid: null` is a 400 rather than an unchecked stop; omit the field
        entirely to stop without a check, which is what a hand-written `curl`
        does. The check narrows the race and cannot close it — see K14 in
        `docs/KNOWN-ISSUES.md`.

        The guard is weaker than the paragraphs above suggest, because this
        operation reads its body as `Option<Json<ShutdownRequest>>` — see the
        note on body handling at the top of this document. A body that type-checks
        is checked; a body that does not parse is *dropped*, not refused. So
        `{"expect_pid": "1234"}` — the string a shell produces from `"$PID"` —
        stops the daemon without a check and the 409 never fires, and the same
        goes for a negative or out-of-range PID, or a truncated body. The 400
        below is reached only by a body that parses *and* carries
        `expect_pid: null`. Send the field as a bare JSON number, or omit the
        body entirely.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expect_pid:
                  type: integer
                  description: The PID the caller believes it is addressing.
      responses:
        "200":
          description: Shutdown has been requested; the daemon exits after the response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: >
            `expect_pid` was present but not a PID. Omitting the field is how a
            caller stops without a check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `expect_pid` names another process. The daemon that answered is not
            the one the caller meant to stop, so it is still running; the error
            names the PID that did answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hosts:
    get:
      summary: List host profiles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostProfile" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The hosts configuration could not be read, or could not be parsed. Answered with 500 rather than an empty list, so a broken config is distinguishable from no hosts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Create or update a host profile
      description: >-
        Matched by `name`, and a match is replaced **wholesale**, not merged:
        `add_host_core` assigns the new profile over the old one
        (`core.rs:172-173`), so every field the request omits resets to its
        default — `init_command` becomes null, `tags` empty, `group` falls back
        to `default` after `normalize_config`. `update_host_core` (the desktop
        path) carries `password` and `passphrase` over when they are omitted;
        this route carries nothing over. `HostProfile.required` is
        `[name, host]`, so a two-field body is contract-valid and will clear the
        rest. Reading the record first does not make a read-modify-write safe
        either: the response redacts `password` and `passphrase` to null
        (`redacted_for_transport`), so echoing it back clears the stored
        credentials. Send the complete profile when you mean to replace one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostProfile" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostProfile" }
        "400":
          description: |
            The profile is rejected by validation, or the hosts configuration could not be
            written (`save_config`: a read-only config directory, a full disk). A save
            failure answers 400 rather than 500, so the status alone cannot tell "your
            profile is malformed" from "we could not write it" — read the message.
          content:
            application/json:
