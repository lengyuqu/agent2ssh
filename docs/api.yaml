openapi: "3.1.0"
info:
  title: Agent2SSH Daemon API
  version: "0.3.0"
  description: Local HTTP API for the Agent2SSH capability layer.
servers:
  - url: http://127.0.0.1:7722
    description: Local daemon

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Bearer token from `~/.agent2ssh/daemon.token` or a scoped token configured in `~/.agent2ssh/daemon_tokens.toml`.

  schemas:
    HostProfile:
      type: object
      required: [name, host]
      properties:
        name:      { type: string }
        host:      { type: string }
        user:      { type: string, nullable: true }
        port:      { type: integer, nullable: true }
        key_path:  { type: string, nullable: true }
        password:  { type: string, nullable: true }
        jump_host: { type: string, nullable: true }
        risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }
        tags:
          type: array
          items: { type: string }
        env:       { type: string, nullable: true }
        role:      { type: string, nullable: true }
        owner:     { type: string, nullable: true }

    ExecRequest:
      type: object
      required: [host, command]
      properties:
        host:             { type: string }
        command:          { type: string }
        force:            { type: boolean, default: false }
        timeout_secs:     { type: integer, nullable: true }
        stdin:            { type: string, nullable: true }
        max_output_bytes: { type: integer, nullable: true }
        reason:           { type: string, nullable: true }
        change_id:        { type: string, nullable: true }
        source:           { type: string, nullable: true }

    ExecResult:
      type: object
      properties:
        host:        { type: string }
        command:     { type: string }
        exit_code:   { type: integer, nullable: true }
        stdout:      { type: string }
        stderr:      { type: string }
        duration_ms: { type: integer }
        risk_level:  { $ref: "#/components/schemas/RiskLevel" }
        truncated:   { type: boolean }

    ExecMultiResult:
      type: object
      properties:
        host:   { type: string }
        result: { $ref: "#/components/schemas/ExecResult", nullable: true }
        error:  { type: string, nullable: true }

    ExecMultiRequest:
      type: object
      required: [hosts, command]
      properties:
        hosts:
          type: array
          items: { type: string }
        command:      { type: string }
        force:        { type: boolean, default: false }
        timeout_secs: { type: integer, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        strategy:
          type: object
          nullable: true
          properties:
            concurrency: { type: integer, nullable: true }
            max_failures: { type: integer, nullable: true }
            batch_size: { type: integer, nullable: true }
            pause_between_batches_secs: { type: integer, nullable: true }
        reason:       { type: string, nullable: true }
        change_id:    { type: string, nullable: true }
        source:       { type: string, nullable: true }

    ExecMultiBatchResult:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ExecMultiResult" }
        total_hosts:       { type: integer }
        successful:        { type: integer }
        failed:            { type: integer }
        skipped:           { type: integer }
        stopped_early:     { type: boolean }
        batches_executed:  { type: integer }
        total_duration_ms: { type: integer }

    ExecCompareRequest:
      type: object
      required: [hosts, command]
      properties:
        hosts:
          type: array
          items: { type: string }
        command:      { type: string }
        force:        { type: boolean, default: false }
        timeout_secs: { type: integer, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }

    ExitCodeGroup:
      type: object
      properties:
        exit_code: { type: integer, nullable: true }
        hosts:
          type: array
          items: { type: string }

    OutputDiff:
      type: object
      properties:
        host: { type: string }
        output_summary: { type: string }
        differs_from_first: { type: boolean }

    OutputComparison:
      type: object
      properties:
        identical: { type: boolean }
        common_prefix: { type: string }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/OutputDiff" }

    ExecComparison:
      type: object
      properties:
        hosts_count: { type: integer }
        exit_code_groups:
          type: array
          items: { $ref: "#/components/schemas/ExitCodeGroup" }
        stdout_comparison: { $ref: "#/components/schemas/OutputComparison" }
        stderr_comparison: { $ref: "#/components/schemas/OutputComparison" }
        summary: { type: string }

    PingResult:
      type: object
      properties:
        host:       { type: string }
        reachable:  { type: boolean }
        latency_ms: { type: integer, nullable: true }
        error:      { type: string, nullable: true }

    RiskLevel:
      type: string
      enum: [low, medium, high, blocked]

    DaemonScope:
      type: object
      description: Optional least-privilege scope for daemon tokens or remote daemon aliases.
      properties:
        allowed_hosts:
          type: array
          items: { type: string }
          description: Allowed host names. Empty means all hosts.
        allowed_tags:
          type: array
          items: { type: string }
          description: Allowed host tags. Empty means all tags.
        allowed_commands:
          type: array
          items: { type: string }
          description: Allowed command or operation patterns. Empty means all commands.
        denied_commands:
          type: array
          items: { type: string }
          description: Denied command or operation patterns, checked before allowed patterns.

    AuditEntry:
      type: object
      properties:
        id:          { type: string, format: uuid }
        ts:          { type: string, format: date-time }
        host:        { type: string }
        command:     { type: string }
        exit_code:   { type: integer, nullable: true }
        duration_ms: { type: integer }
        risk_level:  { $ref: "#/components/schemas/RiskLevel" }
        reason:      { type: string, nullable: true }
        change_id:   { type: string, nullable: true }
        source:      { type: string, nullable: true }

    AgentEvent:
      type: object
      properties:
        id:         { type: string, format: uuid }
        event_type:
          type: string
          enum:
            - exec_started
            - exec_output
            - exec_completed
            - approval_requested
            - approval_responded
            - host_connected
            - host_disconnected
            - session_opened
            - session_input
            - session_output
            - session_closed
            - audit_rotated
            - config_changed
            - gate_changed
            - gate_rejected
            - limit_rejected
            - anomaly_detected
        timestamp:  { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true

    AuditFilter:
      type: object
      properties:
        host:       { type: string, nullable: true }
        risk_level: { $ref: "#/components/schemas/RiskLevel", nullable: true }
        exit_code:  { type: integer, nullable: true }
        since:      { type: string, format: date-time, nullable: true }
        until:      { type: string, format: date-time, nullable: true }
        limit:      { type: integer, default: 20 }

    SftpUploadRequest:
      type: object
      required: [host, local_path, remote_path]
      properties:
        host:        { type: string }
        local_path:  { type: string }
        remote_path: { type: string }

    SftpDownloadRequest:
      type: object
      required: [host, remote_path, local_path]
      properties:
        host:        { type: string }
        remote_path: { type: string }
        local_path:  { type: string }

    SftpResult:
      type: object
      properties:
        host:        { type: string }
        local_path:  { type: string }
        remote_path: { type: string }
        direction:   { type: string, enum: [upload, download] }
        duration_ms: { type: integer }

    SessionOpenRequest:
      type: object
      required: [host]
      properties:
        host: { type: string }
        source: { type: string, nullable: true }

    SessionWriteRequest:
      type: object
      required: [input]
      properties:
        input: { type: string }
        source: { type: string, nullable: true }

    ForwardAddRequest:
      type: object
      required: [host, direction, bind_port, target_host, target_port]
      properties:
        host:        { type: string }
        direction:   { type: string, enum: [local, remote] }
        bind_port:   { type: integer }
        target_host: { type: string }
        target_port: { type: integer }

    ForwardRule:
      type: object
      properties:
        id:          { type: string, format: uuid }
        host:        { type: string }
        direction:   { type: string, enum: [local, remote] }
        bind_port:   { type: integer }
        target_host: { type: string }
        target_port: { type: integer }

    ConnectionStatus:
      type: object
      properties:
        host:        { type: string }
        connected:   { type: boolean }
        socket_path: { type: string, nullable: true }
        # K5 connection self-healing: liveness/reconnect state from the supervisor.
        healthy:      { type: boolean, description: "Last keepalive probe succeeded (distinct from connected)." }
        reconnecting: { type: boolean, description: "Supervisor is re-establishing a dropped connection." }
        last_error:   { type: string, nullable: true, description: "Last keepalive/reconnect error." }

    ApprovalRequest:
      type: object
      properties:
        id:           { type: string, format: uuid }
        host:         { type: string }
        command:      { type: string }
        risk_level:   { $ref: "#/components/schemas/RiskLevel" }
        requested_at: { type: string, format: date-time }
        ttl_secs:     { type: integer, description: "TTL in seconds before auto-expiry" }
        status:       { type: string, enum: [pending, approved, rejected, timed_out] }

    ApprovalResponse:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }

    WebhookConfig:
      type: object
      properties:
        url: { type: string, nullable: true }
        events:
          type: array
          items: { type: string }
        secret: { type: string, nullable: true }

    Playbook:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }
        steps:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        risk_override: { $ref: "#/components/schemas/RiskLevel", nullable: true }

    PlaybookRunRequest:
      type: object
      required: [playbook, host]
      properties:
        playbook: { type: string }
        host:     { type: string }
        force:    { type: boolean, default: false }
        params:
          type: object
          nullable: true
          additionalProperties: { type: string }
        reason:   { type: string, nullable: true }
        change_id: { type: string, nullable: true }
        source:   { type: string, nullable: true }

    PlaybookStepResult:
      type: object
      properties:
        step:    { type: integer }
        command: { type: string }
        result:  { $ref: "#/components/schemas/ExecResult", nullable: true }
        error:   { type: string, nullable: true }

    PlaybookRunResult:
      type: object
      properties:
        playbook:          { type: string }
        host:              { type: string }
        steps_completed:
          type: array
          items: { $ref: "#/components/schemas/PlaybookStepResult" }
        success:           { type: boolean }
        total_duration_ms: { type: integer }

    DaemonInfo:
      type: object
      properties:
        alias:     { type: string }
        url:       { type: string }
        connected: { type: boolean }
        scope:     { $ref: "#/components/schemas/DaemonScope", nullable: true }

    ExecutionGateStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [active, paused]
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, nullable: true }
        reason:     { type: string, nullable: true }

    GateUpdate:
      type: object
      properties:
        source: { type: string, nullable: true }
        reason: { type: string, nullable: true }

    DaemonDiagnostic:
      type: object
      properties:
        alias: { type: string }
        url:   { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name:    { type: string }
              status:  { type: string, enum: [ok, warning, error] }
              message: { type: string }
              details: { type: string, nullable: true }
        overall_status: { type: string, enum: [ok, warning, error] }

    TeamConfigExport:
      type: object
      description: Shareable configuration bundle. Host profiles are exported with `key_path` and `password` stripped.
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/HostProfile" }
        risk_rules: { type: string, nullable: true, description: "Raw risk_rules.toml content" }
        playbooks:  { type: string, nullable: true, description: "Raw playbooks.toml content" }

    TerminalBroadcastRequest:
      type: object
      required: [targets, command]
      properties:
        targets:
          type: array
          minItems: 2
          maxItems: 32
          items:
            type: object
            required: [terminal_id, host]
            properties:
              terminal_id: { type: string, format: uuid }
              host: { type: string }
        command: { type: string, description: Single command without control characters; the server appends Enter. }
        force: { type: boolean, default: false }
        all_or_nothing: { type: boolean, default: true }
    TerminalBroadcastResponse:
      type: object
      required: [broadcast_id, enqueued_any, all_or_nothing, targets]
      properties:
        broadcast_id: { type: string, format: uuid }
        enqueued_any: { type: boolean }
        all_or_nothing: { type: boolean }
        targets:
          type: array
          items:
            type: object
            properties:
              terminal_id: { type: string, format: uuid }
              host: { type: string }
              risk_level: { type: string, enum: [low, medium, high, blocked] }
              requires_approval: { type: boolean }
              matched_policy: { type: string, nullable: true }
              authorized: { type: boolean }
              approval_granted: { type: boolean }
              sent: { type: boolean, description: Enqueued to the live terminal; does not mean remote completion. }
              error: { type: string, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  uptime_secs: { type: integer }
                  config_dir_available: { type: boolean }
                  embedded_ssh_available: { type: boolean }
                  embedded_keygen_available: { type: boolean }
                  ssh_available:
                    type: boolean
                    deprecated: true
                    description: Backward-compatible alias; runtime SSH uses the embedded backend.
                  pid: { type: integer }

  /hosts:
    get:
      summary: List host profiles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostProfile" }
    post:
      summary: Create or update a host profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostProfile" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostProfile" }

  /hosts/import:
    post:
      summary: Import hosts from ~/.ssh/config
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostProfile" }

  /hosts/{name}:
    delete:
      summary: Remove a host profile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ping:
    post:
      summary: Check host reachability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hosts]
              properties:
                hosts:        { type: array, items: { type: string } }
                timeout_secs: { type: integer, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PingResult" }

  /exec:
    post:
      summary: Execute a command over SSH
      description: Applies bearer-token scope, execution gate, execution limits, effective risk, and approval policy before running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "400":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /exec-multi:
    post:
      summary: Execute a command on multiple hosts
      description: Applies bearer-token scope, execution gate, execution limits, effective risk, and approval policy before running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecMultiRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecMultiBatchResult" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /exec/compare:
    post:
      summary: Execute a command on multiple hosts and compare results
      description: Applies bearer-token scope, execution gate, execution limits, effective risk, and approval policy before running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecCompareRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecComparison" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /gate:
    get:
      summary: Read the global execution gate status
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionGateStatus" }

  /gate/pause:
    post:
      summary: Pause non-desktop daemon execution
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionGateStatus" }

  /gate/resume:
    post:
      summary: Resume daemon execution
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionGateStatus" }

  /exec/stream:
    get:
      summary: WebSocket streaming exec
      description: |
        Upgrade to WebSocket. Send an ExecRequest JSON message.
        The stream uses the same SSH command construction and authorization
        path as `/exec`: bearer-token scope, execution gate, execution limits,
        effective risk, and approval policy are enforced before output streams.
        Server pushes: {"type":"stdout","data":"..."}, {"type":"stderr","data":"..."}, {"type":"exit","code":0,"duration_ms":1234}
      responses:
        "101":
          description: Switching Protocols

  /terminal:
    get:
      summary: WebSocket interactive terminal
      description: |
        Upgrade to WebSocket and attach to an embedded-SSH interactive PTY.
        Query parameters are `host` and `token`; the token is passed in the
        query string because browser WebSocket handshakes cannot set an
        Authorization header. The server first sends a JSON text frame:
        {"type":"connected","host":"...","address":"...","username":"...","fingerprint_sha256":"SHA256:...","host_key_algorithm":"...","server_banner":"..."}.
        Terminal input/output then streams as binary frames. Resize control is
        sent as a JSON text frame: {"type":"resize","cols":120,"rows":36}.
        Terminal connections use the embedded SSH transport, including
        jump-host proxy channels, and do not require system `ssh` or `sshpass`.
        Completed input lines are
        authorized before bytes are forwarded to the remote PTY; denied input is
        reported as an error frame and dropped.
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /terminal/broadcast/preview:
    post:
      summary: Preview an authenticated multi-terminal broadcast
      description: Resolves live terminal IDs, verifies token ownership, scope, gate, effective risk and approval requirements. It never sends terminal input.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalBroadcastRequest" }
      responses:
        "200":
          description: Per-target safety preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalBroadcastResponse" }

  /terminal/broadcast:
    post:
      summary: Authorize and enqueue a multi-terminal command
      description: |
        Freezes the explicit live-terminal target set, performs all authorization
        and approvals before sending any input, then enqueues the command plus a
        server-owned carriage return. `all_or_nothing` defaults to true. This is
        authorization-atomic, not remote execution-atomic; per-target `sent`
        means accepted by the live terminal queue, not completed remotely.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalBroadcastRequest" }
      responses:
        "200":
          description: Per-target authorization and enqueue results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalBroadcastResponse" }

  /recordings/config:
    description: Recording endpoints require the unrestricted admin token; scoped tokens are rejected.
    get:
      summary: Read the opt-in terminal recording setting
      responses:
        "200":
          description: Recording configuration
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean, default: false }
    put:
      summary: Enable or disable recording for new terminal sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Updated recording configuration }

  /recordings:
    get:
      summary: List local asciicast v2 terminal recordings
      description: Recordings may contain sensitive terminal output and are not included in WebDAV sync.
      responses:
        "200":
          description: Recording metadata, newest first

  /recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical UUID recording identifier; paths and arbitrary filenames are rejected.
        schema: { type: string, format: uuid }
    get:
      summary: Read recording metadata and asciicast v2 JSONL content
      responses:
        "200": { description: Recording metadata and content }
        "404": { description: Missing or invalid recording }
    delete:
      summary: Permanently delete a sensitive recording
      description: Requires `confirm=delete`; successful deletion is appended to the security audit log.
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string, const: delete }
      responses:
        "200": { description: Deleted recording metadata }
        "400": { description: Confirmation missing or recording id invalid }

  /events/stream:
    get:
      summary: Subscribe to daemon events
      description: |
        Authenticated Server-Sent Events stream. Each event uses event name
        `agent2ssh`; the data payload is an AgentEvent JSON object. Used by
        the desktop Live Agent Activity panel to observe local daemon/session
        activity and streaming exec output.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames containing AgentEvent JSON in data lines.
        "401":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /audit:
    get:
      summary: Query audit log
      parameters:
        - name: host
          in: query
          schema: { type: string }
        - name: risk_level
          in: query
          schema: { $ref: "#/components/schemas/RiskLevel" }
        - name: exit_code
          in: query
          schema: { type: integer }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          description: Substring match against command / host / source
          schema: { type: string }
        - name: command_pattern
          in: query
          schema: { type: string }
        - name: host_env
          in: query
          schema: { type: string }
        - name: host_role
          in: query
          schema: { type: string }
        - name: host_owner
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /audit/export:
    get:
      summary: Export filtered audit records as JSONL or CSV
      parameters:
        - name: format
          in: query
          description: "`jsonl` (default) or `csv`"
          schema: { type: string, enum: [jsonl, csv], default: jsonl }
        - name: host
          in: query
          schema: { type: string }
        - name: risk_level
          in: query
          schema: { $ref: "#/components/schemas/RiskLevel" }
        - name: exit_code
          in: query
          schema: { type: integer }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: command_pattern
          in: query
          schema: { type: string }
        - name: host_env
          in: query
          schema: { type: string }
        - name: host_role
          in: query
          schema: { type: string }
        - name: host_owner
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        "400":
          description: Unsupported format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

