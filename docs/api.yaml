  /resident-sessions:
    post:
      summary: Open a resident session in a local terminal environment
      description: |
        Spawns a long-lived shell for a `local:<id>` environment (`local:pwsh`, `local:vs`,
        `local:wsl[:<distribution>]`, ...) and blocks until it is warm, so later commands pay no
        environment-establishment cost and the shell's own state (cwd, variables) persists across
        commands. Shell state persisting is a semantic difference from one-shot `/local-exec`,
        which stays the default.
        Applies bearer-token scope, execution gate, execution limits, effective risk, and approval
        policy keyed on the environment's host id; containers are refused (one-shot exec targets).
        Sessions die with the daemon, on idle TTL (AGENT2SSH_RESIDENT_IDLE_TTL_SECS, default 600),
        on a command timeout, or when a command exits the shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, description: "The `local:<id>` environment to live in" }
                source: { type: string }
                force: { type: boolean }
                reason: { type: string }
                change_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  host: { type: string }
                  label: { type: string }
                  warmup_ms: { type: integer }
        "400":
          description: |
            The `host` is not a `local:<id>` environment, names a container, or cannot be
            built; the concurrent-session cap is reached
            (`AGENT2SSH_MAX_RESIDENT_SESSIONS`, default 8); the warm-up failed; or the
            command was refused by risk policy (blocked) or by the approver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied — the token's allowed hosts and tags do not cover this environment id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out.
