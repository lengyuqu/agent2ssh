          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
