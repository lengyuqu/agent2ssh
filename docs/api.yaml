  /health-snapshot:
    get:
      summary: Read the last collected health snapshot
      description: >-
        Reads the snapshot file and returns it; it collects nothing. Collection
        is `POST /health-snapshot`, so a 200 here can predate the call by any
        amount of time and `collected_at` is the only thing that says how old it
        is. Takes no query parameters — `hosts` and `timeout_secs` are honoured
        by the POST, not here. A scoped token is not refused: the `hosts` list
        is filtered down to the hosts its scope allows it to observe, so the
        same call returns fewer rows instead of a 403. Before a first
        collection the status is still 200, but the body is
        `{"error": "...", "hint": "..."}` rather than a `HealthSnapshot`.
      responses:
        "200":
          description: >-
            A `HealthSnapshot` object, not a bare array: `get_health_snapshot`
            serializes `health::HealthSnapshot`, and this route only reads the
            snapshot file — it never collects one, so a 200 body can predate the
            call by any amount of time.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: A snapshot that was collected at some point.
                    required: [hosts, collected_at]
                    properties:
                      hosts:
                        type: array
                        items:
                          type: object
                          properties:
                            host:         { type: string }
                            reachable:    { type: boolean }
                            latency_ms:   { type: integer, nullable: true }
                            uptime:       { type: string, nullable: true }
                            load_avg:     { type: string, nullable: true }
                            disk_usage:   { type: string, nullable: true }
                            memory_usage: { type: string, nullable: true }
                            collected_at: { type: string, format: date-time }
                            error:        { type: string, nullable: true }
                      collected_at: { type: string, format: date-time }
                      total_ms:     { type: integer }
                  - type: object
                    description: >-
                      No collection has run yet. `get_health_snapshot` answers
                      `Err(_)` with this shape under the same 200, so a client
                      that requires `hosts` and `collected_at` rejects a
                      legitimate response.
                    required: [error, hint]
                    properties:
                      error: { type: string }
                      hint:  { type: string }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Collect health snapshot for specified hosts
      description: >-
        Triggers a concurrent health collection for the given hosts, or for every
        configured host when `hosts` is omitted or empty. The body is read as
        `Option<Json<…>>`, so a body that does not parse — a bare string where
        the array belongs, a non-numeric `timeout_secs`, invalid JSON — counts as
        omitted and the request collects *every* host instead of being refused
        (see the note on body handling at the top of this document). On a large
        config that is a slow 200 where a 422 was expected.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts:        { type: array, items: { type: string }, description: "Host aliases (default: all configured hosts)." }
                timeout_secs: { type: integer, default: 10 }
      responses:
        "200":
          description: The snapshot that was just collected (same `HealthSnapshot` shape as `GET`).
          content:
            application/json:
              schema:
                type: object
                required: [hosts, collected_at]
                properties:
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        host:         { type: string }
                        reachable:    { type: boolean }
                        latency_ms:   { type: integer, nullable: true }
                        uptime:       { type: string, nullable: true }
                        load_avg:     { type: string, nullable: true }
                        disk_usage:   { type: string, nullable: true }
                        memory_usage: { type: string, nullable: true }
                        collected_at: { type: string, format: date-time }
                        error:        { type: string, nullable: true }
                  collected_at: { type: string, format: date-time }
                  total_ms:     { type: integer }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: >-
            Only when the host list is expanded from the config file and that read
            fails. Naming explicit `hosts` avoids it: an unknown alias is not an
            error but a per-host row with `reachable: false`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Local configuration lifecycles ─────────────────────────────────────────
  #
  # Command snippets, sensitive-data redaction rules, terminal highlight rules
  # and SSH algorithm preferences. Each is backed by one file under
  # `~/.agent2ssh/` written with owner-only permissions. Redaction and highlight
  # rules are keyed by their pattern/keyword, which is also their identity: a
  # regular expression is not usable as a URL path segment, so the identity
  # travels in the request body and updates and removals get their own POST
  # paths instead of `/{pattern}`.

  /snippets:
    get:
      summary: List command snippets
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snippet" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The snippet store could not be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Create or replace a command snippet, keyed by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Snippet"
      responses:
        "200":
          description: The full snippet list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snippet" }
        "400":
          description: Invalid snippet name or command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /snippets/{name}:
    delete:
      summary: Remove a command snippet
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Whether a snippet was removed.
          content:
            application/json:
              schema: { type: boolean }
        "400":
          description: Invalid snippet name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /redact/rules:
    get:
      summary: List sensitive-data redaction rules
      description: The rules this instance applies before it writes an audit record, webhook notification, playbook result or diagnostic export. Seeds the built-in set on first read.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactRuleInfo" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Add a redaction rule
      description: A rule's pattern is its identity, so a pattern that is already present is rejected rather than overwritten, and an invalid regex is rejected before anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, replacement]
              properties:
                pattern:     { type: string, description: "Regular expression to match; also the rule's identity." }
                replacement: { type: string, description: "Literal replacement text, used verbatim." }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactRuleInfo" }
        "400":
          description: The pattern does not compile, matches the empty string, or is already in the set. An empty replacement is allowed — it deletes the matched text rather than substituting it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /redact/rules/update:
    post:
      summary: Replace the redaction rule identified by pattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, replacement]
              properties:
                pattern:     { type: string, description: "The pattern that identifies the rule to replace." }
                replacement: { type: string }
                new_pattern: { type: string, description: "Rename the rule to this pattern (default: keep)." }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactRuleInfo" }
        "400":
          description: No rule matches the pattern, or the new pattern does not compile, matches the empty string, or is already taken by another rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /redact/rules/delete:
    post:
      summary: Remove a redaction rule
      description: "Requires `force: true`. Removing a rule stops that class of secret being redacted everywhere this instance writes, so a call without it is rejected with 400 and changes nothing. `POST .../reset` restores the built-in set."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                pattern: { type: string }
                force:   { type: boolean, description: "Must be true." }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactRuleInfo" }
        "400":
          description: Missing `force`, or no rule matches the pattern.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /redact/rules/reset:
    post:
      summary: Restore the built-in redaction rule set
      description: Discards every edit. This is the way back from a removal, because it only ever adds rules back.
      responses:
        "200":
          description: The restored rule list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactRuleInfo" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The built-in set could not be written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /highlight/rules:
    get:
      summary: List terminal highlight rules
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HighlightRule" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Add a terminal highlight rule
      description: A rule's keyword is its identity, so a duplicate is rejected. Rules are stored as regular expressions, so a caller that wants plain-text matching has to escape the keyword itself before sending it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword, name, color]
              properties:
                keyword:           { type: string }
                name:              { type: string }
                color:             { type: string }
                enabled:           { type: boolean, default: true }
                is_regex:          { type: boolean, default: true }
                is_case_sensitive: { type: boolean, default: false }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HighlightRule" }
        "400":
          description: Empty keyword, a missing or over-long name, a color that is not `#RRGGBB`, or a keyword already in the set. The keyword's regex syntax is deliberately not checked here — the renderer compiles it with JavaScript, whose grammar differs from the one a Rust-side check would use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /highlight/rules/update:
    post:
      summary: Replace the terminal highlight rule identified by keyword
      description: The rule is sent whole, so the caller reads it first and returns the fields it wants to keep unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword, rule]
              properties:
                keyword: { type: string, description: "The keyword that identifies the rule to replace." }
                rule:    { $ref: "#/components/schemas/HighlightRule" }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HighlightRule" }
        "400":
          description: No rule matches the keyword, or the replacement rule fails the same checks as an added one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /highlight/rules/delete:
    post:
      summary: Remove a terminal highlight rule
      description: "Requires `force: true` so a mistyped keyword cannot quietly drop a rule the caller meant to keep. A call without it is rejected with 400 and changes nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties:
                keyword: { type: string }
                force:   { type: boolean, description: "Must be true." }
      responses:
        "200":
          description: The full rule list after the write.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HighlightRule" }
        "400":
          description: Missing `force`, or no rule matches the keyword.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /highlight/rules/reset:
    post:
      summary: Restore the built-in terminal highlight rules
      description: Discards every edit.
      responses:
        "200":
          description: The restored rule list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HighlightRule" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The built-in set could not be written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /algo/prefs:
    get:
      summary: Show the SSH algorithm preferences in effect
      description: Returns the preferences that will be used for the next handshake, whether they are an override or the built-in defaults, and the defaults they would fall back to.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlgoPrefsState" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      summary: Replace the SSH algorithm preferences
      description: Sent whole rather than field by field, so a caller changing one list reads the current value first. Each list must be non-empty, free of duplicates and composed of plausible algorithm names, so a list that could not complete a handshake is rejected rather than written. Takes effect on the next handshake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshAlgoPrefs"
      responses:
        "200":
          description: The preferences in effect after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlgoPrefsState" }
        "400":
          description: A list is empty, repeats an entry, or contains an implausible algorithm name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
    delete:
      summary: Drop the SSH algorithm overrides
      description: Goes back to the built-in safe defaults.
      responses:
        "200":
          description: The preferences in effect after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlgoPrefsState" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The stored override could not be removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Interactive prompts (2FA / OTP) ────────────────────────────────────────
  #
  # When a connection or command needs an answer the SSH library cannot get on
  # its own — a keyboard-interactive challenge, an OTP — the daemon parks the
  # question here and waits. A caller polls for pending prompts, shows them to a
  # human, and posts the answer back by nonce.

  /prompts/pending:
    get:
      summary: List prompts waiting for an answer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        nonce:       { type: string, description: "Identifies this prompt when answering it." }
                        prompt_text: { type: string, description: "The question as the server asked it." }
                  count: { type: integer }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /prompts/respond:
    post:
      summary: Answer a pending prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, answer]
              properties:
                nonce:  { type: string }
                answer: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, nonce]
                properties:
                  status: { type: string, enum: [responded] }
                  nonce:  { type: string }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No prompt is waiting under that nonce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }