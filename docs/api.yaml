  /daemons/{alias}/exec:
    post:
      summary: Execute a command through a configured daemon alias
      description: Applies the caller token scope, local remote-alias scope, execution gate, execution limits, and local authorization before forwarding to a remote daemon. The remote daemon may enforce its own scoped token and policy again.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "400":
          description: A local alias was requested and the local command failed, or the request is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >-
            Two different failures share this code. The usual one is the
            middleware's — a missing or invalid bearer token — and its body is
            `{"error": "unauthorized"}`. The other comes from the handler, after
            the middleware has already accepted the caller: this machine holds no
            token for the named remote daemon (`proxy_exec`), so the forward
            cannot authenticate *to* it. That body names the alias, so a client
            that retries a 401 as if its own credentials were wrong will retry
            forever.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied or approval rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No remote daemon is registered under this alias, or the token cannot see the one that is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Approval timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
        "423":
          description: Execution gate paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Execution limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "500":
          description: The HTTP client used to reach the remote daemon could not be built.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "502":
          description: >-
            The remote daemon could not be reached, or answered with a body that
            could not be read. A refusal is forwarded verbatim: when the remote
            answers non-2xx, this operation returns that same status with the
            remote's body, so a 4xx here may have originated on the remote rather
            than on this daemon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

