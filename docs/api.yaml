          description: "The command is empty, over the length cap, or contains control characters; there are fewer than 2 or more than 32 targets; or a `terminal_id` is a duplicate. A `terminal_id` that is not a UUID is **not** a 400 — it is resolved to no live endpoint and comes back per target as `authorized: false` with `terminal is not connected`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }
  /terminal/broadcast:
    post:
      summary: Authorize and enqueue a multi-terminal command
      description: |
        Freezes the explicit live-terminal target set, performs all authorization
        and approvals before sending any input, then enqueues the command plus a
        server-owned carriage return. `all_or_nothing` defaults to true. This is
        authorization-atomic, not remote execution-atomic; per-target `sent`
        means accepted by the live terminal queue, not completed remotely.
        A target whose authorization is refused is reported in the response body
        with `authorized: false` and an `error`; the HTTP status stays 200 and
        nothing is sent to that target, so a per-target refusal never surfaces as
        a 4xx from this operation. A paused execution gate and a rate-limit
        rejection are two of those per-target refusals — `terminal_broadcast_run`
        folds both into every eligible target's `error` and returns 200 — which is
        why no `423` and no `429` are listed below. The gate verdict is decided in
        `terminal_broadcast_preview_results`, the same function the `/preview`
        route calls, so a preview that reports `execution gate paused` predicts the
        run exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalBroadcastRequest" }
      responses:
        "200":
          description: >-
            Per-target authorization and enqueue results. A refused target appears
            here with `authorized: false`, not as a 4xx, so the status code alone
            says nothing about which targets were authorized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalBroadcastResponse" }
        "400":
          description: "Same validation as `/terminal/broadcast/preview`: empty command, control characters, fewer than 2 or more than 32 targets, or a duplicate `terminal_id`. A non-UUID `terminal_id` is resolved per target, not rejected here."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "415":
          description: The body did not declare `application/json`. Rejected by the `Json` extractor before the handler runs.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: The body parsed as JSON but did not match this schema. Rejected by the `Json` extractor before the handler runs; a syntax error instead arrives as 400.
          content:
            text/plain:
              schema: { type: string }

