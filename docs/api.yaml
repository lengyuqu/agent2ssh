          application/json:
            schema:
              type: object
              properties:
                playbook:
                  type: string
                  deprecated: true
                  description: Legacy duplicate of the path parameter; rejected with 400 if it does not match.
                params:
                  type: object
                  additionalProperties: { type: string }
                  nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  playbook: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:             { type: integer }
                        command_template: { type: string }
                        command_resolved: { type: string }
                        params_used:
                          type: array
                          items: { type: string }

  /daemons/view:
    get:
      summary: Unified view of the local daemon and all configured remote daemons
      responses:
        "200":
          content:
            application/json:
              schema: { type: object }

  /diagnostics:
    get:
      summary: Run connectivity/auth/version diagnostics against all configured remote daemons
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DaemonDiagnostic" }

  /diagnostics/{alias}:
    get:
      summary: Run diagnostics against one configured remote daemon
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DaemonDiagnostic" }

  /version-check/{alias}:
    get:
      summary: Check protocol/version compatibility with a configured remote daemon
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { type: object }

  /config/export:
    get:
      summary: Export shareable team configuration
      description: Hosts are exported with `key_path` and `password` stripped; includes raw `risk_rules.toml` and `playbooks.toml` content when present.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamConfigExport" }

  /config/import:
    post:
      summary: Import a team configuration export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamConfigExport" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts_added:         { type: integer }
                  hosts_skipped:       { type: integer }
                  hosts_updated:       { type: integer }
                  risk_rules_imported: { type: boolean }
                  playbooks_imported:  { type: boolean }

  /config/import/preview:
    post:
      summary: Preview what a team configuration import would change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamConfigExport" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts_to_add:
                    type: array
                    items: { type: string }
                  hosts_to_skip:
                    type: array
                    items: { type: string }
                  hosts_to_update:
                    type: array
                    items: { type: string }
                  risk_rules_change: { type: string, nullable: true }
                  playbooks_change:  { type: string, nullable: true }
                  summary:           { type: string }

  /ssh-sync/diff:
    get:
      summary: Compare Agent2SSH hosts against `~/.ssh/config`
      responses:
        "200":
          content:
            application/json:
              schema: { type: object }

  /ssh-sync/export:
    post:
      summary: Export Agent2SSH hosts to an SSH config include file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:           { type: string }
                  hosts_exported: { type: integer }

  /webdav/status:
    get:
      summary: Inspect versioned portable-configuration sync state
      description: Returns local and remote markers, stable SHA-256 digests, conflict state, and metadata warnings. WebDAV credentials are resolved from server-side configuration and are never returned.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [state, summary]
                properties:
                  state:
                    type: string
                    enum: [in_sync, local_ahead, remote_ahead, diverged, unknown]
                  summary:       { type: string }
                  local_digest:  { type: string, nullable: true }
                  remote_digest: { type: string, nullable: true }
                  base_digest:   { type: string, nullable: true }
                  metadata_error: { type: string, nullable: true }
                  local:         { type: object, nullable: true }
                  remote:        { type: object, nullable: true }

  /health-snapshot:
    get:
      summary: Get health snapshot for configured hosts
      description: Collects health data (uptime, disk, memory, load, SSH latency) for all or specified hosts concurrently via embedded SSH.
      parameters:
        - name: hosts
          in: query
          schema:
            type: array
            items: { type: string }
          description: Host aliases to collect health from (default: all configured hosts).
        - name: timeout_secs
          in: query
          schema: { type: integer, default: 10 }
          description: SSH connection timeout in seconds.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    host:        { type: string }
                    reachable:   { type: boolean }
                    uptime:      { type: string, nullable: true }
                    disk:        { type: string, nullable: true }
                    memory:      { type: string, nullable: true }
                    load:        { type: string, nullable: true }
                    latency_ms:  { type: integer, nullable: true }
                    error:       { type: string, nullable: true }
    post:
      summary: Collect health snapshot for specified hosts
      description: Triggers a concurrent health collection for the given hosts (or all configured hosts if omitted).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts:        { type: array, items: { type: string }, description: "Host aliases (default: all configured hosts)." }
                timeout_secs: { type: integer, default: 10 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    host:        { type: string }
                    reachable:   { type: boolean }
                    uptime:      { type: string, nullable: true }
                    disk:        { type: string, nullable: true }
                    memory:      { type: string, nullable: true }
                    load:        { type: string, nullable: true }
                    latency_ms:  { type: integer, nullable: true }
                    error:       { type: string, nullable: true }
