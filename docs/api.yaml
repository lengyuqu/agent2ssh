            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sftp/mkdir:
    post:
      summary: Create a remote directory
      description: Applies bearer-token scope, execution gate, execution limits, effective risk, and approval policy using an `sftp mkdir ...` operation string.
