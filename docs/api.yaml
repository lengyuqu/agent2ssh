        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Scope denied, or the approval policy refused the stop. A rule outside the token's hosts and tags is answered with 403, not as an unknown id, because the id is resolved against the full tunnel list before its host is checked.
