  /approvals:
    get:
      summary: List approval requests
      description: >-
        Every request the daemon still holds, not only the pending ones:
        `approval_list` sweeps expired pending entries to `timed_out`, then
        returns the whole store in `HashMap` iteration order, so the array is
        neither filtered nor sorted. The sweep runs **when this route is read**,
        not on a timer: the daemon's hourly job is `cleanup_expired_approvals`,
        which only drops entries older than the retention window (30 days by
        default, `AGENT2SSH_APPROVAL_RETENTION_DAYS`) and never flips a
        `pending` entry. So an expired card stays `pending` in the store until
        somebody reads this route or polls its id — `/exec`-style waiters flip
        their own card through `approval_poll`, the broadcast (terminal) path
        has no such waiter. Clients that want the queue must filter
        `status == "pending"` themselves: the desktop does that in a 2 s
        polling loop, with the SSE bus as the fast path, so a client that only
        listens to SSE will miss expiry entirely. The array must not be assumed
        ordered. There is no pagination and no query parameter: it is whatever
        the in-memory store holds, which is `approvals.jsonl` as loaded at
        startup (entries past the retention window are already dropped at load
        time) plus everything recorded since, minus what compaction removed —
        so "history" is bounded by retention, and a request older than 30 days
        is not merely unpaged, it is gone.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalRequest" }

        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /approvals/{id}/approve:
    post:
      summary: Approve a pending request
      description: >
        With an empty body the command is approved as requested. With
        `{"command": "..."}` the approver approves that text instead, and it is
        the text that runs. The rewrite is re-assessed: it is refused (400) if
        it is blocked, riskier than the request, empty, or if the request was
        not raised as rewritable (`context.rewritable`; currently only
        `POST /exec`). A malformed body is a 400, never a plain approval.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                command: { type: string, description: "Command to approve instead of the requested one" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: The id is not a UUID, or an approve body is malformed / asks for a rewrite that is refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Requires the unrestricted admin token; a scoped token gets 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            The authentication middleware could not read `daemon_tokens.toml` while validating a
            non-admin token, so it could not tell a scoped token from an unknown one. Applies to
            every authed route, not just this one — a broken `daemon_tokens.toml` answers 500 to
            any token that is not the admin token, until the file parses again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /approvals/{id}/reject:
    post:
      summary: Reject a pending request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
