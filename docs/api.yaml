            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: A rate or concurrency limit was exceeded (the shared `reject_if_rate_limited` preflight, or the local-environment session cap). The per-command session cap on `/sessions` is a 400 here, not a 429.
          content:
