[package]
name = "agent2ssh-app"
version = "0.4.5"
description = "SSH capability layer for general-purpose agents"
authors = ["agent2ssh"]
license = "MIT"
edition = "2021"
# Both russh 0.65 and this crate require 1.89: `store.rs` calls
# `File::lock_shared`, which became stable there. `clippy::incompatible_msrv`
# enforces the declared floor for this crate's own code.
rust-version = "1.89"
default-run = "agent2ssh-app"

[lib]
name = "agent2ssh"
path = "src/lib.rs"

[[bin]]
name = "agent2ssh-app"
path = "src/main.rs"
required-features = ["tauri"]

[[bin]]
name = "agent2ssh"
path = "src/bin/agent2ssh.rs"
required-features = []

[[bin]]
name = "agent2ssh-mcp"
path = "src/bin/agent2ssh-mcp.rs"
required-features = []

[[bin]]
name = "agent2ssh-daemon"
path = "src/bin/agent2ssh-daemon.rs"
required-features = ["daemon"]

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:pin_gtk_generation", "dep:gio", "dep:pango", "dep:cairo-rs", "dep:gdk-pixbuf"]
daemon = ["dep:axum", "dep:tower", "dep:tower-http", "dep:futures-util", "dep:tracing", "dep:tracing-subscriber"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time", "io-util", "sync", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.7", features = ["ws"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Key generation. The private half is written as traditional PKCS#1 PEM because
# that is the encoding `rsa` itself produces; russh reads it like any other
# format, so the old WinCNG constraint that forced this shape is gone but the
# shape is harmless. `rsa` stays on 0.9 for the encoder API this path uses;
# russh brings its own `rsa 0.10.0-rc` for signing, and the two majors coexist
# without exchanging types, so that duplication is deliberate.
rsa = "0.9"
# Ed25519 key generation. Replaces `ssh-key`, whose exact pins on RustCrypto
# pre-releases could not coexist with the transport (see
# docs/plans/russh-migration.md §5). Only the public-key derivation is needed
# from it; the OpenSSH container is written by `openssh_key` so no second parser
# is involved. The pin went from `=3.0.0-pre.6` to the finished `3` when the
# transport moved to russh 0.64, which depends on the release.
ed25519-dalek = "3"
# Legacy `Proc-Type: 4,ENCRYPTED` PEM: the transport decrypts PKCS#1 (RSA) keys
# itself but then parses the plaintext as PKCS#1 whatever the label says, so an
# EC key in that container fails. `legacy_pem` decrypts the container here and
# hands the transport a plaintext PEM instead. `aes` is already in the graph via
# the transport's ciphers; `md-5` is the one addition, and it is the KDF the
# OpenSSL format specifies.
aes = "0.8"
md-5 = "0.10"
# The signature trait, for the local-key signer behind RSA certificates.
# `russh` already depends on this exact major, so naming it adds nothing to the
# build; it only makes `Signer` nameable, which `ssh-key` does not re-export.
signature = "3"
russh = { version = "0.65.1", default-features = false, features = ["rsa", "ring"] }
russh-sftp = { version = "2", default-features = false }
# `pkcs1` is still pinned to the exact release candidate `russh` declares, and
# has to be: 0.8.0-rc.5 re-generalised `RsaPrivateKey<B>` and dropped the API
# this crate's PEM writer calls, so a plain `cargo update` would drift into a
# build that no longer compiles. `pkcs5` is only pinned to the 0.8 line now;
# russh 0.64 accepts the finished 0.8.1, which is why the old `=0.8.0-rc.13`
# pin is gone.
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }
pkcs5 = { version = "0.8", default-features = false }
# Traits only: `rsa` requires a `CryptoRngCore`, and the adapter in `keys.rs`
# fulfils it from the crate's existing `fill_entropy`. The `getrandom` feature is
# deliberately left off so this does not add a second entropy source — nor a
# second `getrandom` major version next to the 0.4 this crate already uses.
rand_core = "0.6"
getrandom = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
futures-util = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
fs2 = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# App-managed credential encryption (K1, master-password model): Argon2id KDF +
# AES-256-GCM. No OS keychain, no plaintext key on disk.
aes-gcm = "0.10"
argon2 = "0.5"
# B43: In-memory passphrase cache — Zeroizing<String> wipes bytes on drop,
# reducing plaintext exposure in memory dumps / swap.
zeroize = { version = "1", features = ["derive"] }
# `netcatty_import`: Electron's `safeStorage` wraps its payload with Chromium's
# OSCrypt, whose macOS/Linux key derivation is PBKDF2-HMAC-**SHA-1** (1003
# iterations, salt `saltysalt`) — the hash is fixed by the format, not chosen
# here. Already in the graph (`sha2`'s sibling, pulled in by the transport), so
# naming it adds no crate to the build; PBKDF2 itself is ~20 lines over this
# plus `hmac`, which keeps us off a second KDF crate whose digest major would
# have to agree with ours.
sha1 = "0.10"
# AST-based command analysis for risk classification (P0-2): tree-sitter-bash
# parses shell commands into a syntax tree, allowing canonical command head
# extraction that is resilient to flag reordering, wrapper stacking, and
# alias variation — unlike glob/substring matching which can be trivially
# bypassed (e.g. "docker system prune -a" != "docker system prune -af").
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# Structured error handling (P1 #4): thiserror for ergonomic error enums,
# regex for redaction pattern validation and NoExpand (P1 #7).
thiserror = "2"
regex = "1"
tempfile = "3"
# G14: interactive terminal (`host open`) — Unix raw-mode (termios) and
# Windows raw-mode (console API) for byte-stream stdin/stdout bridging.
libc = "0.2"
# B24/font: System font enumeration for terminal font selection.
fontdb = "0.23"

# GHSA-wrw7-89jp-8q8g: `glib` 0.18.x's `VariantStrIter` iterators are unsound
# (a `&`-pointed out-argument the optimiser now discards), fixed in 0.20.
#
# `glib` cannot simply be bumped: the GTK3 bindings above it (`gtk`, `gdk`,
# `atk`, `webkit2gtk`, `gdkx11`) have no 0.20 release at all — `gtk` tops out at
# 0.19 — so a lone upgrade leaves two incompatible `glib` majors in one graph.
# What *can* move is the part of the stack nothing names: `glib`, `gio`, `pango`,
# `cairo-rs` and `gdk-pixbuf` are additive across that boundary (the 0.20 crate
# compiles a v2_66+ feature set against the same C library). A dependency on
# them here puts 0.20 in the graph; whether `gtk 0.18` then binds it depends on
# the `^` range each binding declares — `glib` moves, the three visual crates do
# not (see the end of this comment).
#
# `gtk-sys 0.18` pins `glib-sys = 0.18`. Declaring `glib = "0.20"` here moves
# `glib` itself (and with it the `glib-sys` its `-sys` crates ask for) while
# `atk 0.18` keeps its own `glib ^0.18`; nothing in this block names a -sys
# crate, because a second `glib-sys` can only exist once the `glib` they belong
# to does.
#
# Only the tauri desktop feature reaches these crates; the sidecar binaries, the
# daemon and the macOS/Windows builds never see them. The block is gated on the
# feature as well as the target because a target table is resolved by target:
# with `target_os` alone these five crates also entered the graph of
# `--no-default-features` — the build the sidecar binaries and the daemon use
# *to stay off* the GTK stack — where `cargo tree` showed `cairo-rs 0.20` /
# `glib 0.20` hanging directly off `agent2ssh-app`, linked by nothing.
#
# The gate is the feature itself, not a feature condition written into the cfg:
# a dependency-table cfg is evaluated at *manifest-parse* time, before cargo has
# resolved any feature, so a feature condition in that cfg is rejected outright
# and every cargo command fails with a manifest error ("feature ... is not
# allowed in target.'cfg(...)'") — which is how this PR first broke the whole
# pipeline. An *optional*
# dependency that the `tauri` feature enables is the same gate in the one form
# the parser accepts: with `--no-default-features` nothing asks for
# `pin_gtk_generation`, so the five crates are not in the graph at all; with the
# default features `tauri` is on, so they are — and the pin applies exactly as
# before. `glib` is renamed to `pin_gtk_generation` so the block reads as a pin
# rather than a crate anything links. The effect is on `glib` and `gio` only:
# `gtk 0.18` binds `pango` / `cairo-rs` / `gdk-pixbuf` by their own declared
# `^0.18`, so those three are pulled in twice (0.18 through `gtk`, 0.20 here)
# and no code links the 0.20 copy. Checked on Debian 12 + GLib 2.74:
# `cargo tree -e normal --invert pango@0.18.3` starts at `gdk`/`gtk 0.18`.
# Paying two copies to keep the advisory off the reachable one is the trade
# `docs/KNOWN-ISSUES.md` K17 records; delete the block (and its `tauri` entry)
# once `gtk` moves to a `glib 0.20` generation and `wry`/`tao` follow.
[target.'cfg(target_os = "linux")'.dependencies]
pin_gtk_generation = { version = "0.20", package = "glib", optional = true }
gio = { version = "0.20", optional = true }
pango = { version = "0.20", optional = true }
cairo-rs = { version = "0.20", optional = true }
gdk-pixbuf = { version = "0.20", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
    # `netcatty_import`: Electron's `safeStorage` on Windows is DPAPI, so the
    # Windows path needs `CryptUnprotectData` rather than another cipher.
    "Win32_Security_Cryptography",
    # ...and `LocalFree`, which windows-sys keeps under System::Memory even
    # though it is Foundation's `HLOCAL` that it takes and returns.
    "Win32_System_Memory",
] }
# Pageant's transport, for the SSH agent. `russh` already pulls this in on
# Windows, so naming it here adds no crate to the build — but it does make
# `PageantStream` nameable, which `russh` does not re-export and which the
# agent module needs in order to put Pageant and the OpenSSH named pipe behind
# one `AsyncRead + AsyncWrite` type.
pageant = "0.2"

[dev-dependencies]
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
serial_test = "3"
ctor = "0.8"

# RSA key generation is pure big-integer arithmetic, and `num-bigint-dig` is
# roughly two orders of magnitude slower when built without optimisation: the
# 3072-bit key the key-generation tests produce took long enough to look like a
# hang, turning a unit test into a timeout. Optimising this one crate keeps the
# debug profile's fast builds for everything else while making the tests usable.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Same reasoning for the test profile, which `cargo test` uses for dependencies
# by default only at `opt-level = 0`.
[profile.test.package.num-bigint-dig]
opt-level = 3
