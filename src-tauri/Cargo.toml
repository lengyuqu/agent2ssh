[package]
name = "agent2ssh-app"
version = "0.3.0"
description = "SSH capability layer for general-purpose agents"
authors = ["agent2ssh"]
edition = "2021"
default-run = "agent2ssh-app"

[lib]
name = "agent2ssh"
path = "src/lib.rs"

[[bin]]
name = "agent2ssh-app"
path = "src/main.rs"
required-features = ["tauri"]

[[bin]]
name = "agent2ssh"
path = "src/bin/agent2ssh.rs"
required-features = []

[[bin]]
name = "agent2ssh-mcp"
path = "src/bin/agent2ssh-mcp.rs"
required-features = []

[[bin]]
name = "agent2ssh-daemon"
path = "src/bin/agent2ssh-daemon.rs"
required-features = ["daemon"]

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:tauri-build"]
daemon = ["dep:axum", "dep:tower", "dep:tower-http", "dep:futures-util", "dep:tracing", "dep:tracing-subscriber"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "sync", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.7", features = ["ws"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
ssh2 = "0.9"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519"] }
# Key generation for the one RSA encoding libssh2's WinCNG backend can read.
# `ssh-key` generates RSA but cannot write a private key as traditional PEM —
# it only emits the OpenSSH container, whose parser is absent from WinCNG — so
# the PKCS#1 encoder has to come from `rsa` itself. Pinned to 0.9 on purpose:
# `ssh-key` 0.7.0-rc.10 asks for `rsa 0.10.0-rc.18`, and `rand_core` 0.10, both
# pre-releases, for a code path this crate does not use.
rsa = "0.9"
# Traits only: `rsa` requires a `CryptoRngCore`, and the adapter in `keys.rs`
# fulfils it from the crate's existing `fill_entropy`. The `getrandom` feature is
# deliberately left off so this does not add a second entropy source — nor a
# second `getrandom` major version next to the 0.4 this crate already uses.
rand_core = "0.6"
getrandom = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
futures-util = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
fs2 = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# App-managed credential encryption (K1, master-password model): Argon2id KDF +
# AES-256-GCM. No OS keychain, no plaintext key on disk.
aes-gcm = "0.10"
argon2 = "0.5"
# B43: In-memory passphrase cache — Zeroizing<String> wipes bytes on drop,
# reducing plaintext exposure in memory dumps / swap.
zeroize = { version = "1", features = ["derive"] }
# AST-based command analysis for risk classification (P0-2): tree-sitter-bash
# parses shell commands into a syntax tree, allowing canonical command head
# extraction that is resilient to flag reordering, wrapper stacking, and
# alias variation — unlike glob/substring matching which can be trivially
# bypassed (e.g. "docker system prune -a" != "docker system prune -af").
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# Structured error handling (P1 #4): thiserror for ergonomic error enums,
# regex for redaction pattern validation and NoExpand (P1 #7).
thiserror = "2"
regex = "1"
tempfile = "3"
# G14: interactive terminal (`host open`) — Unix raw-mode (termios) and
# Windows raw-mode (console API) for byte-stream stdin/stdout bridging.
libc = "0.2"
# B24/font: System font enumeration for terminal font selection.
fontdb = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_System_Console", "Win32_Foundation"] }
# Swap libssh2's Windows crypto backend from WinCNG to OpenSSL, and build that
# OpenSSL from source so the linked binary has no OpenSSL DLL to find at load
# time.
#
# WinCNG offers MODP Diffie-Hellman only. OpenSSH >= 10.0 dropped every
# `diffie-hellman-group*` method, so a WinCNG client and a modern server share no
# key-exchange algorithm at all and the handshake dies before authentication with
# `Session(-5) Unable to exchange encryption keys`. OpenSSL also brings
# curve25519/ECDH, ed25519/ECDSA host keys, AES-GCM, and the OpenSSH private-key
# container parser that `ssh_key_format` probes for, so switching backends lifts
# all four limits at once. Each one is observable from outside the code:
# `agent2ssh algo get` gains the algorithms and `agent2ssh keys algorithm`
# switches its recommendation from RSA to Ed25519 on its own.
#
# The two features are not interchangeable, and both are required:
# - `openssl-on-win32` is what makes `libssh2-sys`'s build script define
#   `LIBSSH2_OPENSSL`. That script tests the `CARGO_FEATURE_OPENSSL_ON_WIN32`
#   environment variable alone and never inspects `vendored-openssl`, so with
#   only the latter the build would compile an OpenSSL and still link WinCNG.
# - `vendored-openssl` is what makes `openssl-sys` build OpenSSL from source
#   (`openssl-src` 300.x, i.e. OpenSSL 3.x) instead of searching for an
#   installed copy. Without it the build fails outright on any machine that has
#   no OpenSSL — every CI runner included.
# Together they keep the Windows binary self-contained: there is no
# `libssl-*.dll`/`libcrypto-*.dll` to ship, and none that can be missing on a
# user's machine. Linking a local pre-built OpenSSL instead works, but only
# because its import libraries happen to be import libraries: the binary then
# loads its crypto from a DLL and fails at startup where that DLL is absent,
# which trades the key-exchange bug for a harder-to-diagnose one.
#
# Scoped to `cfg(windows)` on purpose: `libssh2-sys`'s `openssl-on-win32` turns
# on its `cfg(windows)` `openssl-sys` dependency, whereas on Linux/macOS it would
# pull in an unconditional one and demand a system OpenSSL. Keeping this entry
# target-scoped is what lets the Unix CI legs keep building untouched.
#
# Building OpenSSL from source needs a C toolchain (MSVC, already required) and a
# *full* Perl. Git for Windows ships a trimmed Perl that is not enough, so
# `src-tauri/.cargo/config.toml` pins `OPENSSL_SRC_PERL` to
# `scripts/win-perl.cmd`, which resolves a complete distribution and explains
# itself when there is none. NASM is optional: `openssl-src` probes for it and
# falls back to `no-asm` when it is missing, which still builds a working OpenSSL
# without the assembly routines. It is installed in the Windows CI legs and
# available from Scoop (`scoop install nasm`) so both ends produce the same,
# faster binary rather than two kinds of build that differ only in speed.
#
# `OPENSSL_NO_VENDOR` is deliberately not set anywhere: it exists as an escape
# hatch to go back to a pre-built OpenSSL, and setting it would quietly undo all
# of the above.
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }

[dev-dependencies]
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
serial_test = "3"
ctor = "0.8"

# RSA key generation is pure big-integer arithmetic, and `num-bigint-dig` is
# roughly two orders of magnitude slower when built without optimisation: the
# 3072-bit key the key-generation tests produce took long enough to look like a
# hang, turning a unit test into a timeout. Optimising this one crate keeps the
# debug profile's fast builds for everything else while making the tests usable.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Same reasoning for the test profile, which `cargo test` uses for dependencies
# by default only at `opt-level = 0`.
[profile.test.package.num-bigint-dig]
opt-level = 3
