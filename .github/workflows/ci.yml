# =============================================================================
# CI / Release Workflow
# =============================================================================
#
# This workflow serves dual purposes:
#
# 1. **PR dry-run**: Every pull request triggers the full `build` job matrix,
#    which compiles all binaries (CLI, MCP, daemon) across 4 target platforms
#    (x86_64 macOS, aarch64 macOS, x86_64 Linux, x86_64 Windows), runs unit
#    tests, integration tests, CLI smoke tests, the explicit contract-consistency
#    gate, and builds the frontend. This acts as a release dry-run — if a PR
#    passes all checks here, the code is ready to be merged and released.
#
# 2. **Release**: When a GitHub release is published, the same build job produces
#    release binaries and uploads them as assets. The `tauri-bundle` job then
#    builds platform-native installers (DMG, AppImage, deb, MSI/NSIS).
#
# No separate dry-run job is needed: the PR build IS the dry-run.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  contract-consistency:
    name: Contract consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-contract-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: MCP tools match docs/skills.md
        run: cargo test --no-default-features --test daemon_integration mcp_tools_match_skills_md_documentation
        working-directory: src-tauri

      - name: OpenAPI and daemon schema contracts
        run: |
          cargo test --no-default-features --test daemon_integration exec_request_schema_includes_reason_and_change_id
          cargo test --no-default-features --test daemon_integration exec_multi_body_schema_matches_contract
          cargo test --no-default-features --test daemon_integration exec_multi_batch_result_schema_matches_contract
          cargo test --no-default-features --test daemon_integration playbook_run_body_schema_matches_contract
          cargo test --no-default-features --test daemon_integration audit_export_response_contract
        working-directory: src-tauri

      - name: CLI help matches documented flags
        run: |
          cargo test --no-default-features --test cli_smoke cli_exec_help_shows_reason_and_change_id
          cargo test --no-default-features --test cli_smoke cli_exec_multi_help_shows_reason_and_change_id
          cargo test --no-default-features --test cli_smoke cli_playbook_run_help_shows_reason_and_change_id
        working-directory: src-tauri

  build:
    needs: contract-consistency
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust cargo to PATH
        if: contains(matrix.target, 'apple-darwin')
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm install

      # ── Test suite (runs on every push/PR, not just releases) ────────────

      - name: Rust unit tests
        run: cargo test --no-default-features --lib
        working-directory: src-tauri

      - name: Rust integration tests (daemon)
        run: cargo test --no-default-features --test daemon_integration
        working-directory: src-tauri

      - name: Rust CLI smoke tests
        run: cargo test --no-default-features --test cli_smoke
        working-directory: src-tauri

      # ── Compilation checks ────────────────────────────────────────────────

      - name: Rust check (CLI + MCP)
        run: cargo check --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Rust check (daemon)
        run: cargo check --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Frontend build
        run: npm run build

      # ── PR dry-run: build release binaries to validate compilation ───────
      # On PRs we build in release mode to catch optimization-level errors
      # that only appear with -O2 / LTO, mirroring the release build.
      - name: Build validation (PR dry-run)
        if: github.event_name == 'pull_request'
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      # ── Release: build and upload ─────────────────────────────────────────

      - name: Build release binaries
        if: github.event_name == 'release'
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Generate checksums
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh${EXT}" "dist/agent2ssh-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp${EXT}" "dist/agent2ssh-mcp-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon${EXT}" "dist/agent2ssh-daemon-${{ matrix.target }}${EXT}"
          mkdir -p "dist/package-${{ matrix.target }}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh${EXT}" "dist/package-${{ matrix.target }}/agent2ssh${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp${EXT}" "dist/package-${{ matrix.target }}/agent2ssh-mcp${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon${EXT}" "dist/package-${{ matrix.target }}/agent2ssh-daemon${EXT}"
          tar -czf "dist/agent2ssh-${{ matrix.target }}.tar.gz" -C "dist/package-${{ matrix.target }}" .
          rm -rf "dist/package-${{ matrix.target }}"
          bash scripts/generate-checksums.sh dist
          mv dist/CHECKSUMS-SHA256.txt "dist/CHECKSUMS-SHA256-${{ matrix.target }}.txt"

      - name: Upload release assets
        if: github.event_name == 'release' && matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent2ssh-${{ matrix.target }}
            dist/agent2ssh-mcp-${{ matrix.target }}
            dist/agent2ssh-daemon-${{ matrix.target }}
            dist/agent2ssh-${{ matrix.target }}.tar.gz
            dist/CHECKSUMS-SHA256-${{ matrix.target }}.txt

      - name: Upload release assets (Windows)
        if: github.event_name == 'release' && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent2ssh-${{ matrix.target }}.exe
            dist/agent2ssh-mcp-${{ matrix.target }}.exe
            dist/agent2ssh-daemon-${{ matrix.target }}.exe
            dist/agent2ssh-${{ matrix.target }}.tar.gz
            dist/CHECKSUMS-SHA256-${{ matrix.target }}.txt

  tauri-bundle:
    needs: contract-consistency
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust cargo to PATH
        if: contains(matrix.target, 'apple-darwin')
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-tauri-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm install

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build sidecar binaries
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Prepare sidecars for Tauri
        shell: bash
        run: ./scripts/prepare-sidecars.sh ${{ matrix.target }}

      - name: Frontend build
        run: npm run build

      # K3: import the Apple Developer ID certificate into a temporary keychain so
      # macOS bundles can be Developer ID-signed (a prerequisite for notarization).
      # No-op when the secret is unset (e.g. fork PRs) so the workflow still runs.
      - name: Import Apple code-signing certificate
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set — skipping signing import (ad-hoc build)."
            exit 0
          fi
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f certificate.p12

      - name: Tauri bundle
        shell: bash
        run: |
          if [ -n "$A2S_TAURI_SIGNING_PRIVATE_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$A2S_TAURI_SIGNING_PRIVATE_KEY"
          fi
          if [ -n "$A2S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$A2S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          fi
          if [ -n "$A2S_APPLE_SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$A2S_APPLE_SIGNING_IDENTITY"
          elif [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            export APPLE_SIGNING_IDENTITY="-"
          fi
          if [ -n "$A2S_APPLE_ID" ] && [ -n "$A2S_APPLE_PASSWORD" ] && [ -n "$A2S_APPLE_TEAM_ID" ]; then
            export APPLE_ID="$A2S_APPLE_ID"
            export APPLE_PASSWORD="$A2S_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$A2S_APPLE_TEAM_ID"
          fi
          if [ -n "$A2S_WINDOWS_CERTIFICATE_THUMBPRINT" ]; then
            export WINDOWS_CERTIFICATE_THUMBPRINT="$A2S_WINDOWS_CERTIFICATE_THUMBPRINT"
          fi
          npx @tauri-apps/cli build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # Updater signing (signs the artifacts the in-app updater verifies).
          A2S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          A2S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization. When these are empty the
          # config's ad-hoc identity ("-") is used and notarization is skipped.
          A2S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A2S_APPLE_ID: ${{ secrets.APPLE_ID }}
          A2S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          A2S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (set bundle.windows.certificateThumbprint
          # in tauri.conf.json, or use Azure Trusted Signing via these vars).
          A2S_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}

      # K3: publish the updater manifest (latest.json) and signatures so the
      # in-app updater endpoint can serve them.
      - name: Upload updater manifest
        if: contains(matrix.target, 'apple-darwin')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload macOS bundle
        if: contains(matrix.target, 'apple-darwin')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Windows bundle
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*

  # K4: real-SSH end-to-end against a containerized OpenSSH server. Runs on every
  # push/PR (Linux runners ship Docker) to close the "runtime-unverified" gaps in
  # the native transport: real exec, SFTP round-trip, recursive transfer (J4),
  # and resume (K6).
  real-ssh-e2e:
    needs: contract-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build release CLI
        run: cargo build --release --no-default-features --bin agent2ssh
        working-directory: src-tauri

      - name: Run dockerized SSH E2E
        run: scripts/e2e-docker.sh
