# =============================================================================
# CI / Release Workflow
# =============================================================================
#
# This workflow serves dual purposes:
#
# 1. **PR dry-run**: Every pull request triggers the full `build` job matrix,
#    which compiles all binaries (CLI, MCP, daemon) across 4 target platforms
#    (x86_64 macOS, aarch64 macOS, x86_64 Linux, x86_64 Windows), runs unit
#    tests, integration tests, and CLI smoke tests, and builds the frontend.
#    This acts as a release dry-run — if a PR passes all checks here, the code
#    is ready to be merged and released.
#
# 2. **Release**: When a GitHub release is published, the same build job produces
#    release binaries and uploads them as assets. The `tauri-bundle` job then
#    builds platform-native installers (DMG, AppImage, deb, MSI/NSIS).
#
# No separate dry-run job is needed: the PR build IS the dry-run.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm install

      # ── Test suite (runs on every push/PR, not just releases) ────────────

      - name: Rust unit tests
        run: cargo test --no-default-features --lib
        working-directory: src-tauri

      - name: Rust integration tests (daemon)
        run: cargo test --no-default-features --test daemon_integration
        working-directory: src-tauri

      - name: Rust CLI smoke tests
        run: cargo test --no-default-features --test cli_smoke
        working-directory: src-tauri

      # ── Compilation checks ────────────────────────────────────────────────

      - name: Rust check (CLI + MCP)
        run: cargo check --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Rust check (daemon)
        run: cargo check --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Frontend build
        run: npm run build

      # ── PR dry-run: build release binaries to validate compilation ───────
      # On PRs we build in release mode to catch optimization-level errors
      # that only appear with -O2 / LTO, mirroring the release build.
      - name: Build validation (PR dry-run)
        if: github.event_name == 'pull_request'
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      # ── Release: build and upload ─────────────────────────────────────────

      - name: Build release binaries
        if: github.event_name == 'release'
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Generate checksums
        if: github.event_name == 'release'
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh${EXT}" "dist/agent2ssh-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp${EXT}" "dist/agent2ssh-mcp-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon${EXT}" "dist/agent2ssh-daemon-${{ matrix.target }}${EXT}"
          bash scripts/generate-checksums.sh dist

      - name: Upload release assets
        if: github.event_name == 'release' && matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/agent2ssh
            src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp
            src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon
            dist/CHECKSUMS-SHA256.txt

      - name: Upload release assets (Windows)
        if: github.event_name == 'release' && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/agent2ssh.exe
            src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp.exe
            src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon.exe
            dist/CHECKSUMS-SHA256.txt

  tauri-bundle:
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-tauri-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm install

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build sidecar binaries
        run: |
          cargo build --release --no-default-features --bin agent2ssh --bin agent2ssh-mcp --target ${{ matrix.target }}
          cargo build --release --no-default-features --features daemon --bin agent2ssh-daemon --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Prepare sidecars for Tauri
        run: |
          mkdir -p src-tauri/binaries
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh${EXT}" \
             "src-tauri/binaries/agent2ssh-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-daemon${EXT}" \
             "src-tauri/binaries/agent2ssh-daemon-${{ matrix.target }}${EXT}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent2ssh-mcp${EXT}" \
             "src-tauri/binaries/agent2ssh-mcp-${{ matrix.target }}${EXT}"

      - name: Frontend build
        run: npm run build

      - name: Tauri bundle
        run: npx @tauri-apps/cli build --target ${{ matrix.target }} --bundles default
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS bundle
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Windows bundle
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
